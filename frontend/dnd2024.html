  { name: 'Chill Touch', level: 0, school: 'Necromancy', castingTime: '1 action', range: '120 feet', components: 'V, S', duration: 'Instantaneous', classes: ['wizard', 'sorcerer'], description: 'Ranged spell attack with 1d8 necrotic damage', descriptionFull: 'You create a ghostly, skeletal hand in the space of a creature within range. Make a ranged spell attack against the creature to assail it with the chill of the grave. On a hit, the target takes 1d8 necrotic damage, and it can\'t regain hit points until the start of your next turn. Until then, the hand clings to the target. If the target is undead, it has disadvantage on attack rolls against you until the end of your next turn. The spell\'s damage increases by 1d8 when you reach 5th level (2d8), 11th level (3d8), and 17th level (4d8).', concentration: false, ritual: false, damageType: 'Necrotic', saveType: null, source: 'PHB 2024' },
  { name: 'Ray of Frost', level: 0, school: 'Evocation', castingTime: '1 action', range: '60 feet', components: 'V, S', duration: 'Instantaneous', classes: ['wizard', 'sorcerer'], description: 'Ranged spell attack with 1d8 cold damage', descriptionFull: 'A frigid beam of blue-white light springs from your hand toward a creature within range. Make a ranged spell attack against the target. On a hit, it takes 1d8 cold damage, and its speed is reduced by 10 feet until the start of your next turn. The spell\'s damage increases by 1d8 when you reach 5th level (2d8), 11th level (3d8), and 17th level (4d8).', concentration: false, ritual: false, damageType: 'Cold', saveType: null, source: 'PHB 2024' },
  { name: 'Poison Spray', level: 0, school: 'Conjuration', castingTime: '1 action', range: '10 feet', components: 'V, S', duration: 'Instantaneous', classes: ['wizard', 'druid'], description: 'Target makes saving throw taking 1d12 poison damage', descriptionFull: 'You project a jet of acrid, hideous spray hurtling toward a creature within range. The creature must make a Constitution saving throw. On a failed save, the target takes 1d12 poison damage. On a successful save, it takes half as much. The spell\'s damage increases by 1d12 when you reach 5th level (2d12), 11th level (3d12), and 17th level (4d12).', concentration: false, ritual: false, damageType: 'Poison', saveType: 'Constitution', source: 'PHB 2024' },
  { name: 'Produce Flame', level: 0, school: 'Evocation', castingTime: '1 action', range: 'Self', components: 'V, S', duration: '10 minutes', classes: ['druid'], description: 'Create flames in hand or throw as ranged attack', descriptionFull: 'A flickering flame appears in your hand. The flame is nonmagical and doesn\'t use up your resources, but you can\'t have more than one active at a time. You can use an action to throw the flame at a creature within 30 feet or to hurl it at an object. When you do so, make a ranged attack roll, treat the flame as if it were a weapon with which you\'re proficient. On a hit, the target takes 1d8 fire damage. This spell\'s damage increases by 1d8 when you reach 5th level (2d8), 11th level (3d8), and 17th level (4d8).', concentration: false, ritual: false, damageType: 'Fire', saveType: null, source: 'PHB 2024' },
  { name: 'Shillelagh', level: 0, school: 'Transmutation', castingTime: '1 bonus action', range: 'Self', components: 'V, S, M (mistletoe)', duration: '10 minutes', classes: ['druid'], description: 'Enhance a wooden weapon with magical power', descriptionFull: 'The next time you hit a creature with a weapon attack using a club, quarterstaff, or similar weapon within 1 minute, the weapon\'s damage die for that attack increases to a d8, and the attack deals force damage instead of the weapon\'s normal damage type. After that attack hits or misses, the spell ends.', concentration: false, ritual: false, damageType: 'Force', saveType: null, source: 'PHB 2024' },
  { name: 'Blade Ward', level: 0, school: 'Abjuration', castingTime: '1 action', range: 'Self', components: 'V, S', duration: '1 round', classes: ['wizard', 'sorcerer'], description: 'Take half damage from weapon attacks', descriptionFull: 'You extend your hand and trace a sigil of warding in the air. Until the end of your next turn, you have resistance against bludgeoning, piercing, and slashing damage dealt by weapon attacks.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'True Strike', level: 0, school: 'Divination', castingTime: '1 action', range: '30 feet', components: 'S', duration: 'Concentration, until end of next turn', classes: ['wizard', 'bard', 'warlock'], description: 'Gain advantage on your next attack roll', descriptionFull: 'You extend your hand and point a finger at a target in range. Your magic grants you a brief insight into the target\'s defenses. On your next turn, you gain advantage on your first attack roll against this target, provided that this spell hasn\'t ended.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Thunderclap', level: 0, school: 'Evocation', castingTime: '1 action', range: 'Self (15-foot radius)', components: 'S', duration: 'Instantaneous', classes: ['wizard', 'sorcerer', 'artificer'], description: 'Creatures around you make saving throw for 1d6 thunder damage', descriptionFull: 'You create a burst of thunderous sound that can be heard up to 100 feet away. Each creature other than you within 15 feet of you must make a Constitution saving throw. On a failed save, a creature takes 1d6 thunder damage. The damage increases by 1d6 when you reach 5th level (2d6), 11th level (3d6), and 17th level (4d6).', concentration: false, ritual: false, damageType: 'Thunder', saveType: 'Constitution', source: 'PHB 2024' },
  { name: 'Word of Radiance', level: 0, school: 'Evocation', castingTime: '1 action', range: '5 feet', components: 'V, M (a holy symbol)', duration: 'Instantaneous', classes: ['cleric'], description: 'Creatures around you save against 1d6 radiant damage', descriptionFull: 'You utter a divine word, and burning radiance erupts from you. Each creature of your choice that you can see within 5 feet of you must make a Constitution saving throw. On a failed save, a creature takes 1d6 radiant damage. The spell\'s damage increases by 1d6 when you reach 5th level (2d6), 11th level (3d6), and 17th level (4d6).', concentration: false, ritual: false, damageType: 'Radiant', saveType: 'Constitution', source: 'PHB 2024' },
  { name: 'Dancing Lights', level: 0, school: 'Evocation', castingTime: '1 action', range: '120 feet', components: 'V, S, M (a bit of phosphorus)', duration: 'Concentration, up to 1 minute', classes: ['wizard', 'bard', 'sorcerer'], description: 'Create dancing lights for illumination', descriptionFull: 'You create up to four torch-sized lights within range, making them appear like torches, lanterns, or glowing orbs that hover in the air for the spell\'s duration. You can also combine the four lights into one glowing vaguely humanoid form of Medium size. Whichever form you choose, each light sheds dim light in a 10-foot radius. As a bonus action on your turn, you can move the lights up to 60 feet to a new spot within range. A light must be within 20 feet of another light created by this spell, and a light winks out if it exceeds the spell\'s range.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Druidcraft', level: 0, school: 'Transmutation', castingTime: '1 action', range: '30 feet', components: 'V, S', duration: 'Instantaneous or 1 hour', classes: ['druid'], description: 'Perform minor druidic effects', descriptionFull: 'Depending on the version of the spell you choose, you create one of the following magical effects within range: you predict what the weather will be at your location for the next 24 hours; you instantly make a flower blossom, a seed pod open, or a leaf bud bloom; you create a harmless sensory effect, such as falling leaves, a puff of wind, the sound of a small animal, or the faint odor of skunk. However, if the weather is caused by a spell, you can\'t predict it. Each effect from this spell lasts for 1 hour.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Resistance', level: 0, school: 'Abjuration', castingTime: '1 action', range: 'Touch', components: 'V, S, M (a miniature cloak)', duration: 'Concentration, up to 1 minute', classes: ['cleric', 'druid'], description: 'Grant a creature resistance to one damage type', descriptionFull: 'You touch one willing creature. Once before the spell ends, the target can roll a d4 and add the number rolled to one saving throw of its choice. It can roll the die before or after making the saving throw. The spell then ends.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Spare the Dying', level: 0, school: 'Necromancy', castingTime: '1 action', range: 'Touch', components: 'V, S', duration: 'Instantaneous', classes: ['cleric', 'wizard'], description: 'Stabilize a dying creature', descriptionFull: 'You touch a living creature that has 0 hit points. The creature becomes stable. This spell has no effect on undead or constructs.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Message', level: 0, school: 'Transmutation', castingTime: '1 action', range: '120 feet', components: 'V, S, M (a short piece of copper wire)', duration: '1 round', classes: ['wizard', 'bard', 'sorcerer', 'artificer'], description: 'Send a secret message to a creature', descriptionFull: 'You point your finger toward a creature within range and whisper a message. The target hears the message and can reply in a whisper that only you can hear. You can cast this spell through solid walls if you are familiar with the target and know it is beyond the barrier, but the wall must not be more than 1 foot thick. The spell is blocked by 1 foot of stone, 1 inch of metal, or a thin sheet of lead.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Light', level: 0, school: 'Evocation', castingTime: '1 action', range: 'Touch', components: 'V, M (a firefly or phosphorescent moss)', duration: '1 hour', classes: ['wizard', 'bard', 'cleric', 'sorcerer', 'artificer'], description: 'Make an object shed bright light', descriptionFull: 'You touch one object that is no larger than 10 feet in any dimension. The object sheds bright light in a 20-foot radius and dim light for an additional 20 feet. If the object is opaque, the light shines from one surface you choose. If the object is transparent, the light passes through it and shines from the far side. The light can be colored as you like. Completely covering the object with an opaque material blocks the light. The spell ends if you cast it again on another object or if you use an action to dismiss the spell.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Friends', level: 0, school: 'Enchantment', castingTime: '1 action', range: 'Self', components: 'S, M (a small amount of makeup)', duration: '1 minute', classes: ['bard', 'warlock', 'sorcerer'], description: 'Gain advantage on Charisma checks against one creature', descriptionFull: 'For the spell\'s duration, you have advantage on all Charisma checks directed at one creature of your choice that isn\'t hostile toward you. When the spell ends, that creature knows that you used magic to influence its mood and becomes hostile toward you. A creature prone to violence might attack you. Another creature might seek retribution in other ways (at the DM\'s discretion), depending on the nature of your interaction with it.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Mending', level: 0, school: 'Transmutation', castingTime: '1 minute', range: 'Touch', components: 'V, S, M (two lodestones)', duration: 'Instantaneous', classes: ['wizard', 'bard', 'cleric', 'druid', 'artificer'], description: 'Repair an object', descriptionFull: 'This spell repairs a single break or tear in an object you touch, such as a broken chain link, two halves of a broken key, a torn cloak, or a leaking wineskin. As long as the break or tear is no larger than 1 foot in any dimension, you mend it, leaving no trace of the former damage. This spell can physically repair a magic item or construct, but it can\'t restore magic to such an object.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Encode Thoughts', level: 0, school: 'Enchantment', castingTime: '1 action', range: 'Self', components: 'S', duration: 'Until dispelled', classes: ['artificer', 'wizard'], description: 'Encode your thoughts in a tiny object', descriptionFull: 'Putting a finger to your head, you can magically encode a message of up to 33 words into a tiny object that you can hold in one hand. Casting this spell is a ritual. The encoded message requires a successful DC 15 Intelligence (Arcana) check to be read. You alone can read the message if you encode the message as a private message. The object must be a Tiny object (such as a small gem, piece of parchment, or vial of liquid), and the object cannot be a magic item.', concentration: false, ritual: true, damageType: null, saveType: null, source: 'PHB 2024' },

  // LEVEL 1 SPELLS
  { name: 'Magic Missile', level: 1, school: 'Evocation', castingTime: '1 action', range: '120 feet', components: 'V, S', duration: 'Instantaneous', classes: ['wizard', 'sorcerer'], description: 'Fire 1d4+1 missiles each dealing 1d4+1 force damage', descriptionFull: 'You create three glowing darts of magical force. Each dart hits a creature of your choice that you can see within range. A dart deals 1d4+1 force damage to its target. The darts all strike simultaneously and you can direct them to hit one creature or several. When you cast this spell using a slot of 2nd level or higher, the number of darts increases by one for each slot level above 1st.', concentration: false, ritual: false, damageType: 'Force', saveType: null, source: 'PHB 2024' },
  { name: 'Cure Wounds', level: 1, school: 'Evocation', castingTime: '1 action', range: 'Touch', components: 'V, S', duration: 'Instantaneous', classes: ['artificer', 'bard', 'cleric'], description: 'Touch a creature and restore 1d8 hit points', descriptionFull: 'A creature you touch regains a number of hit points equal to 1d8 + your spellcasting ability modifier. This spell has no effect on undead or constructs. When you cast this spell using a slot of 2nd level or higher, the healing increases by 1d8 for each slot level above 1st.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Healing Word', level: 1, school: 'Evocation', castingTime: '1 bonus action', range: '60 feet', components: 'V, S', duration: 'Instantaneous', classes: ['bard', 'cleric', 'druid'], description: 'Heal a creature you can see for 1d4 hit points', descriptionFull: 'A creature of your choice that you can see within range regains hit points equal to 1d4 + your spellcasting ability modifier. This spell has no effect on undead or constructs. When you cast this spell using a slot of 2nd level or higher, the healing increases by 1d4 for each slot level above 1st.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Shield', level: 1, school: 'Abjuration', castingTime: '1 reaction', range: 'Self', components: 'V, S', duration: '1 round', classes: ['sorcerer', 'wizard', 'artificer'], description: 'Gain +5 AC bonus until your next turn', descriptionFull: 'An invisible barrier of magical force appears and protects you. Until the start of your next turn, you have a +5 bonus to AC, including against the triggering attack, and you take no damage from magic missile.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Sleep', level: 1, school: 'Enchantment', castingTime: '1 action', range: '90 feet', components: 'V, S, M (a pinch of fine sand, rose petals, or a cricket)', duration: '1 minute', classes: ['bard', 'sorcerer', 'wizard'], description: 'Put creatures to sleep in order of lowest HP first', descriptionFull: 'This spell sends creatures into a magical slumber. Roll 5d8; the total is how many hit points of creatures this spell can affect. Creatures within 20 feet of a point of your choice within range are affected in ascending order of their current hit points (ignoring unconscious creatures). Starting with the creature that has the lowest current hit points, each creature affected by this spell falls unconscious until the spell ends, the sleeper takes damage, or someone uses an action to shake the sleeper awake. Undead and creatures immune to being charmed aren\'t affected by this spell.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Charm Person', level: 1, school: 'Enchantment', castingTime: '1 action', range: '30 feet', components: 'V, S', duration: '1 hour', classes: ['bard', 'warlock', 'sorcerer', 'wizard'], description: 'Make one humanoid regard you as a friendly acquaintance', descriptionFull: 'One humanoid creature of your choice that you can see within range must make a Wisdom saving throw. It has disadvantage on the saving throw if you or your companions are fighting it. If it fails the save, it is charmed by you until the spell ends or until you or your companions harm it. The charmed creature regards you as a friendly acquaintance. When the spell ends, the creature knows it was charmed.', concentration: true, ritual: false, damageType: null, saveType: 'Wisdom', source: 'PHB 2024' },
  { name: 'Detect Magic', level: 1, school: 'Divination', castingTime: '1 action', range: 'Self', components: 'V, S', duration: 'Concentration, up to 10 minutes', classes: ['artificer', 'bard', 'cleric', 'druid', 'ranger', 'sorcerer', 'wizard'], description: 'Sense the presence of magic within 30 feet', descriptionFull: 'For the duration, you sense the presence of magic within 30 feet of you. If you sense magic in this way, you can use your action to see a faint aura around any visible creature or object in the area that bears magic, and you learn its school of magic, if any. The spell can penetrate most barriers, but is blocked by 1 foot of stone, 1 inch of metal, a thin sheet of lead, or 3 feet of wood or dirt.', concentration: true, ritual: true, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Thunderwave', level: 1, school: 'Evocation', castingTime: '1 action', range: 'Self (15-foot radius)', components: 'V, S', duration: 'Instantaneous', classes: ['bard', 'druid', 'sorcerer', 'wizard'], description: 'Creatures in radius make saving throw taking 2d8 thunder damage', descriptionFull: 'A wave of thunderous force pushes out from you. Each creature in a 15-foot cube originating from you must make a Constitution saving throw. On a failed save, a creature takes 2d8 thunder damage and is pushed 10 feet away from you. On a successful save, the creature takes half as much damage and isn\'t pushed. In addition, unsecured objects that are completely in the area of effect are automatically pushed 10 feet away from you by the spell\'s effect, and the spell emits a thunderous boom audible out to 300 feet. When you cast this spell using a slot of 2nd level or higher, the damage increases by 1d8 for each slot level above 1st.', concentration: false, ritual: false, damageType: 'Thunder', saveType: 'Constitution', source: 'PHB 2024' },
  { name: 'Hex', level: 1, school: 'Enchantment', castingTime: '1 bonus action', range: '90 feet', components: 'V, S, M (the petrified eye of a newt)', duration: 'Concentration, up to 1 hour', classes: ['warlock'], description: 'Curse a creature with disadvantage on ability checks', descriptionFull: 'You place a curse on a creature that you can see within range. Until the spell ends, you deal an extra 1d6 necrotic damage to the target whenever you hit it with an attack. Also, choose one ability when you cast the spell. The target has disadvantage on ability checks made with the chosen ability. If the target drops to 0 hit points before this spell ends, you can use a bonus action on a subsequent turn of yours to curse another creature. The spell ends if the target drops to 0 hit points before the spell ends.', concentration: true, ritual: false, damageType: 'Necrotic', saveType: null, source: 'PHB 2024' },
  { name: 'Bless', level: 1, school: 'Enchantment', castingTime: '1 action', range: '30 feet', components: 'V, S, M (a sprinkling of holy water)', duration: 'Concentration, up to 1 minute', classes: ['cleric', 'paladin'], description: 'Up to 3 creatures gain +1d4 bonus to attack rolls and saving throws', descriptionFull: 'You bless up to three creatures of your choice within range. Whenever a target makes an attack roll or a saving throw before the spell ends, the target can roll a d4 and add the number rolled to the attack roll or saving throw. When you cast this spell using a slot of 2nd level or higher, you can target one additional creature for each slot level above 1st.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Bane', level: 1, school: 'Enchantment', castingTime: '1 action', range: '30 feet', components: 'V, S, M (a drop of blood)', duration: 'Concentration, up to 1 minute', classes: ['bard', 'cleric'], description: 'Up to 3 creatures subtract 1d4 from attack rolls and saving throws', descriptionFull: 'Up to three creatures of your choice that you can see within range must make a Charisma saving throw. Whenever a target that fails this save makes an attack roll or a saving throw before the spell ends, the target subtracts 1d4 from the roll. When you cast this spell using a slot of 2nd level or higher, you can target one additional creature for each slot level above 1st.', concentration: true, ritual: false, damageType: null, saveType: 'Charisma', source: 'PHB 2024' },
  { name: 'Burning Hands', level: 1, school: 'Evocation', castingTime: '1 action', range: 'Self (15-foot cone)', components: 'V, S', duration: 'Instantaneous', classes: ['sorcerer', 'wizard'], description: 'Creatures in cone make saving throw taking 3d6 fire damage', descriptionFull: 'As you hold your hands with thumbs touching and fingers spread, a thin sheet of flames springs from your hands. Each creature in a 15-foot cone must make a Dexterity saving throw. A creature takes 3d6 fire damage on a failed save, or half as much on a successful one. The fire ignites any flammable objects in the area that aren\'t being worn or carried. When you cast this spell using a slot of 2nd level or higher, the damage increases by 1d6 for each slot level above 1st.', concentration: false, ritual: false, damageType: 'Fire', saveType: 'Dexterity', source: 'PHB 2024' },
  { name: 'Chromatic Orb', level: 1, school: 'Evocation', castingTime: '1 action', range: '90 feet', components: 'V, S, M (a diamond worth at least 50 gp)', duration: 'Instantaneous', classes: ['sorcerer', 'wizard'], description: 'Ranged spell attack dealing 3d8 damage of chosen type', descriptionFull: 'You hurl a 4-inch-diameter sphere of energy at a creature that you can see within range. You choose what type of energy the sphere is (acid, cold, fire, lightning, poison, or thunder). Make a ranged spell attack against the target. On a hit, the target takes 3d8 damage of the type you chose. When you cast this spell using a slot of 2nd level or higher, the damage increases by 1d8 for each slot level above 1st.', concentration: false, ritual: false, damageType: 'Variable', saveType: null, source: 'PHB 2024' },
  { name: 'Color Spray', level: 1, school: 'Illusion', castingTime: '1 action', range: 'Self (15-foot cone)', components: 'V, S', duration: '1 round', classes: ['sorcerer', 'wizard'], description: 'Blind creatures in cone or force them to avert eyes', descriptionFull: 'A blast of color springs from your hand. Roll 6d10; the total is how many hit points of creatures this spell can blind. Creatures in a 15-foot cone originating from you are blinded in ascending order of their current hit points (ignoring unconscious creatures and creatures that can\'t see). Each creature blind by this spell makes a Wisdom saving throw at the end of each of its turns. On a success, it is no longer blinded.', concentration: false, ritual: false, damageType: null, saveType: 'Wisdom', source: 'PHB 2024' },
  { name: 'Dissonant Whispers', level: 1, school: 'Enchantment', castingTime: '1 action', range: '60 feet', components: 'V', duration: 'Instantaneous', classes: ['bard'], description: 'Target makes saving throw taking 3d6 psychic damage and uses reaction to move away', descriptionFull: 'For each creature you choose within range, those creatures must each make a Wisdom saving throw. A target takes 3d6 psychic damage on a failed save, or half as much on a successful one. A target that fails this save must immediately use its reaction, if available, to move as far away from you as it can, and the creatures won\'t move into obviously dangerous ground. When you cast this spell using a slot of 2nd level or higher, the damage increases by 1d6 for each slot level above 1st.', concentration: false, ritual: false, damageType: 'Psychic', saveType: 'Wisdom', source: 'PHB 2024' },
  { name: 'Divine Favor', level: 1, school: 'Evocation', castingTime: '1 bonus action', range: 'Self', components: 'V, S', duration: 'Concentration, up to 1 minute', classes: ['cleric', 'paladin'], description: 'Next weapon attack deals +1d4 radiant damage', descriptionFull: 'Your prayer empowers you with divine radiance. Until the spell ends, the first creature you hit on each of your turns with a weapon attack takes an extra 1d4 radiant damage.', concentration: true, ritual: false, damageType: 'Radiant', saveType: null, source: 'PHB 2024' },
  { name: 'Entangle', level: 1, school: 'Conjuration', castingTime: '1 action', range: '90 feet', components: 'V, S', duration: 'Concentration, up to 1 minute', classes: ['druid', 'ranger'], description: 'Plants grasp creatures in a 20-foot square restraining them', descriptionFull: 'Grasping weeds and vines sprout from the ground in a 20-foot square starting from a point within range. For the duration, these plants turn the ground in the area into difficult terrain. A creature in the area when you cast the spell must succeed on a Strength saving throw or be restrained by the entangling plants until the spell ends. A creature that starts its turn in the area and isn\'t already restrained must succeed on a Strength saving throw or become restrained.', concentration: true, ritual: false, damageType: null, saveType: 'Strength', source: 'PHB 2024' },
  { name: 'Faerie Fire', level: 1, school: 'Evocation', castingTime: '1 action', range: '60 feet', components: 'V', duration: 'Concentration, up to 1 minute', classes: ['bard', 'druid', 'ranger'], description: 'Objects glow making creatures unable to be invisible', descriptionFull: 'Each object in a 20-foot cube within range is outlined in blue, green, or violet light (your choice). Each creature in the area, if it can see, must succeed on a Dexterity saving throw or be outlined in the light if it fails. For the duration, objects and affected creatures shed dim light in a 10-foot radius. Any attack roll against an affected creature or object has advantage if the attacker can see it, and the affected creature or object can\'t benefit from being invisible.', concentration: true, ritual: false, damageType: null, saveType: 'Dexterity', source: 'PHB 2024' },
  { name: 'False Life', level: 1, school: 'Necromancy', castingTime: '1 action', range: 'Self', components: 'V, S, M (a small amount of alcohol or distilled spirits)', duration: '1 hour', classes: ['sorcerer', 'wizard'], description: 'Gain 1d4+4 temporary hit points', descriptionFull: 'Bolstering yourself with a necromantic facsimile of life, you gain 1d4 + 4 temporary hit points for the duration. When you cast this spell using a slot of 2nd level or higher, you gain 5 additional temporary hit points for each slot level above 1st.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Feather Fall', level: 1, school: 'Transmutation', castingTime: '1 reaction', range: '60 feet', components: 'V, M (a small feather or piece of down)', duration: '1 minute', classes: ['bard', 'sorcerer', 'wizard'], description: 'Up to 5 creatures fall slowly at 60 feet per round', descriptionFull: 'Choose up to five falling creatures within range. Instantly, a creature\'s falling speed is reduced to 60 feet per round until the spell ends. If the creature lands before the spell ends, it can use its reaction to reduce its falling damage as if it had fallen 10 feet less.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Find Familiar', level: 1, school: 'Conjuration', castingTime: '1 hour', range: '10 feet', components: 'V, S, M (10 gp worth of charcoal, incense, and herbs)', duration: 'Instantaneous', classes: ['wizard', 'warlock', 'artificer'], description: 'Summon a spirit in animal form to be your familiar', descriptionFull: 'You gain the service of a familiar, a spirit that takes animal form you choose: bat, cat, crab, frog, hawk, lizard, octopus, owl, poisonous snake, fish (quipper), rat, raven, sea horse, spider, or weasel. Appearing in an unoccupied space within 30 feet of you, the familiar has the statistics of the chosen creature, except it obeys your commands and shares your initiative. The familiar acts on your turn each round. The spell ends if the familiar is reduced to 0 hit points, if you dismiss it as an action, or if you haven\'t used it for a year. You can also dismiss your familiar at any time as an action.', concentration: false, ritual: true, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Fog Cloud', level: 1, school: 'Conjuration', castingTime: '1 action', range: '120 feet', components: 'V, S', duration: 'Concentration, up to 1 hour', classes: ['druid', 'ranger', 'sorcerer', 'wizard'], description: 'Create a cloud of fog in a 20-foot radius sphere', descriptionFull: 'You create a 20-foot-radius sphere of fog centered on a point within range. The sphere spreads around corners, and its area is heavily obscured. It lasts for the duration or until a wind of moderate or greater speed (at least 10 miles per hour) disperses it. When you cast this spell using a slot of 2nd level or higher, the radius of the fog increases by 20 feet for each slot level above 1st.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Grease', level: 1, school: 'Conjuration', castingTime: '1 action', range: '60 feet', components: 'V, S, M (a bit of pork rind or butter)', duration: '1 minute', classes: ['wizard', 'artificer'], description: 'Make a 10-foot square slippery, creatures must save or fall prone', descriptionFull: 'Slick grease covers the ground in a 10-foot square centered on a point within range and turns it into difficult terrain for the duration. When the grease appears, each creature standing in its area must succeed on a Dexterity saving throw or fall prone. A creature that enters the area or ends its turn there must also succeed on a Dexterity saving throw or fall prone.', concentration: true, ritual: false, damageType: null, saveType: 'Dexterity', source: 'PHB 2024' },
  { name: 'Hunter\'s Mark', level: 1, school: 'Divination', castingTime: '1 bonus action', range: '90 feet', components: 'V', duration: 'Concentration, up to 1 hour', classes: ['ranger'], description: 'Your next weapon attack on target deals +1d6 damage', descriptionFull: 'You choose a creature you can see within range and mystically mark it as your quarry. Until the spell ends, you deal an extra 1d6 damage to the target whenever you hit it with a weapon attack, and you have advantage on any Wisdom (Perception) or Wisdom (Survival) check you make to find it. If the target drops to 0 hit points before this spell ends, you can use a bonus action on a subsequent turn of yours to mark another creature.', concentration: true, ritual: false, damageType: 'Variable', saveType: null, source: 'PHB 2024' },
  { name: 'Identify', level: 1, school: 'Divination', castingTime: '1 minute', range: 'Touch', components: 'V, S, M (a pearl worth at least 100 gp and an owl feather)', duration: 'Instantaneous', classes: ['artificer', 'bard', 'wizard'], description: 'Learn all properties of a magic item or creature', descriptionFull: 'You choose one object that you must touch throughout the casting of this spell. If it is a magic item or some other magic-imbued object, you learn its properties and how to use them, whether it requires attunement to use, and how many charges it has, if any. You learn whether any spells are affecting the object and what they are. If the object was created by a spell, you learn which spell created it. If you instead touch a creature throughout the casting, you learn what spells, if any, are currently affecting it.', concentration: false, ritual: true, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Jump', level: 1, school: 'Transmutation', castingTime: '1 action', range: 'Touch', components: 'V, S, M (a grasshopper\'s hind leg)', duration: '1 minute', classes: ['ranger', 'sorcerer', 'wizard', 'artificer'], description: 'Creature can triple the distance of jumps', descriptionFull: 'You touch a creature. The creature\'s jump distance is tripled until the spell ends.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Longstrider', level: 1, school: 'Transmutation', castingTime: '1 action', range: 'Touch', components: 'V, S, M (a pinch of dirt)', duration: '1 hour', classes: ['bard', 'druid', 'ranger', 'wizard'], description: 'Creature gains +10 feet to speed', descriptionFull: 'You touch a creature. The target\'s speed increases by 10 feet until the spell ends. When you cast this spell using a slot of 2nd level or higher, you can target one additional creature for each slot level above 1st.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Mage Armor', level: 1, school: 'Abjuration', castingTime: '1 action', range: 'Touch', components: 'V, S, M (a piece of cured leather)', duration: '8 hours', classes: ['sorcerer', 'wizard', 'artificer'], description: 'Target\'s AC becomes 13 + Dex modifier if not wearing armor', descriptionFull: 'You touch a willing creature who isn\'t wearing armor, and a protective magical force surrounds it. Until the spell ends, the target\'s AC is 13 + its Dexterity modifier. The spell ends if the target dons armor or if you dismiss the spell as an action.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Protection from Evil and Good', level: 1, school: 'Abjuration', castingTime: '1 action', range: 'Touch', components: 'V, S, M (holy water or powdered silver and iron)', duration: 'Concentration, up to 10 minutes', classes: ['cleric', 'paladin', 'warlock', 'wizard'], description: 'Target gains advantage against creatures of certain alignments', descriptionFull: 'Until the spell ends, one willing creature you touch is protected against certain types of creatures: aberrations, celestials, dragons, elementals, fey, fiends, and undead. The protection grants the following benefits: Advantage on Saving Throws against spells and abilities used by creatures of the specified types. Damage dealt by creatures of the specified types is reduced by half.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Ray of Sickness', level: 1, school: 'Necromancy', castingTime: '1 action', range: '60 feet', components: 'V, S', duration: 'Instantaneous', classes: ['sorcerer', 'wizard'], description: 'Ranged spell attack dealing 2d8 poison damage, target poisoned', descriptionFull: 'A ray of sickly green energy springs from your fingertip toward a creature within range. Make a ranged spell attack against the target. On a hit, the target takes 2d8 poison damage and must make a Constitution saving throw. On a failed save, it is also poisoned until the end of your next turn. When you cast this spell using a slot of 2nd level or higher, the damage increases by 1d8 for each slot level above 1st.', concentration: false, ritual: false, damageType: 'Poison', saveType: 'Constitution', source: 'PHB 2024' },
  { name: 'Silent Image', level: 1, school: 'Illusion', castingTime: '1 action', range: '60 feet', components: 'V, S, M (a bit of fleece)', duration: 'Concentration, up to 10 minutes', classes: ['bard', 'sorcerer', 'wizard'], description: 'Create a silent visual illusion', descriptionFull: 'You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 15-foot cube. The image appears at a spot within range and lasts for the duration. It is purely visual; it isn\'t accompanied by sound, smell, or other sensory effects. You can use your action while the spell lasts to move the image to any spot within range. Physical interaction with the image reveals it to be an illusion, because things can pass through it.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Speak with Animals', level: 1, school: 'Divination', castingTime: '1 action', range: 'Self', components: 'V, S', duration: '10 minutes', classes: ['bard', 'druid', 'ranger'], description: 'Communicate with beasts as if they understand you', descriptionFull: 'You gain the ability to comprehend and verbally communicate with beasts for the duration. The knowledge and awareness of many beasts is limited by their intelligence, but at minimum, beasts know things about nearby locations and tend to communiate instinctively about danger. They can perform simple tasks on your behalf, and generally treat you as a friendly acquaintance.', concentration: true, ritual: true, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Tasha\'s Hideous Laughter', level: 1, school: 'Enchantment', castingTime: '1 action', range: '60 feet', components: 'V, S, M (tiny props such as a doll and a small hammer)', duration: 'Concentration, up to 1 minute', classes: ['bard', 'wizard'], description: 'Target makes saving throw or falls prone laughing', descriptionFull: 'A creature of your choice that you can see within range perceives everything as hilariously funny and falls into fits of laughter if this spell affects it. The target must succeed on a Wisdom saving throw or fall prone, incapacitated, and unable to stand up for the duration. A creature with an Intelligence score of 4 or less isn\'t affected. At the end of each of the target\'s turns, and when it takes damage, it can make another Wisdom saving throw. The creature has advantage on the save if it\'s triggered by damage. On a success, the spell ends.', concentration: true, ritual: false, damageType: null, saveType: 'Wisdom', source: 'PHB 2024' },
  { name: 'Unseen Servant', level: 1, school: 'Conjuration', castingTime: '1 action', range: '60 feet', components: 'V, S, M (a piece of string and a bit of wood)', duration: '1 hour', classes: ['bard', 'wizard', 'artificer'], description: 'Summon an invisible servant to perform tasks', descriptionFull: 'This spell creates an invisible, mindless servant that can perform simple tasks at your command until the spell ends. The servant springs into existence in an unoccupied space on the ground within range. It has AC 10, 1 hit point, and a Strength of 2, and it can\'t attack. If it drops to 0 hit points, the spell ends. Once as an action, you can mentally command the servant to move up to 15 feet and interact with an object. The servant can perform simple, straightforward tasks. The spell ends early if the servant moves more than 60 feet away from you.', concentration: true, ritual: true, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Witch Bolt', level: 1, school: 'Evocation', castingTime: '1 action', range: '30 feet', components: 'V, S, M (a twig from a tree struck by lightning)', duration: 'Concentration, up to 1 minute', classes: ['sorcerer', 'warlock', 'wizard'], description: 'Ranged spell attack dealing 1d12 lightning damage', descriptionFull: 'A beam of crackling, blue energy springs from your hand to a creature of your choice within range. Make a ranged spell attack against the target. On a hit, the target takes 1d12 lightning damage, and on your turns for the duration of the spell you can use your action to deal 1d12 lightning damage to the target automatically. The spell ends if you use your action to do anything else. The spell also ends if the target is ever outside the spell\'s range or if the target has total cover from you.', concentration: true, ritual: false, damageType: 'Lightning', saveType: null, source: 'PHB 2024' },
  { name: 'Heroism', level: 1, school: 'Enchantment', castingTime: '1 action', range: 'Touch', components: 'V, S', duration: 'Concentration, up to 1 minute', classes: ['bard', 'paladin'], description: 'Target gains 1d8 temporary hit points at start of turn', descriptionFull: 'A willing creature you touch is imbued with bravery. Until the spell ends, the creature is immune to being frightened, and it gains temporary hit points equal to your spellcasting ability modifier at the start of each of its turns. When the spell ends, any remaining temporary hit points fade away.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Inflict Wounds', level: 1, school: 'Necromancy', castingTime: '1 action', range: 'Touch', components: 'V, S', duration: 'Instantaneous', classes: ['cleric'], description: 'Melee spell attack dealing 3d10 necrotic damage', descriptionFull: 'Make a melee spell attack against a creature you can reach. On a hit, the target takes 3d10 necrotic damage. When you cast this spell using a spell slot of 2nd level or higher, the damage increases by 1d10 for each slot level above 1st.', concentration: false, ritual: false, damageType: 'Necrotic', saveType: null, source: 'PHB 2024' },
  { name: 'Comprehend Languages', level: 1, school: 'Divination', castingTime: '1 action', range: 'Self', components: 'V, S, M (pinch of soot and salt)', duration: '1 hour', classes: ['bard', 'sorcerer', 'warlock', 'wizard'], description: 'Understand any spoken language you hear', descriptionFull: 'For the duration, you understand the literal meaning of any spoken language that you hear. You also understand any written language that you see, but you must be touching the surface on which the words are written. It takes about 1 minute to read one page of text. This spell doesn\'t decode secret messages in a text or a glyph, such as an arcane sigil, that isn\'t part of its written language.', concentration: false, ritual: true, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Disguise Self', level: 1, school: 'Illusion', castingTime: '1 action', range: 'Self', components: 'V, S', duration: '1 hour', classes: ['bard', 'sorcerer', 'wizard'], description: 'You appear as a different humanoid of same size', descriptionFull: 'You make yourself—including your clothing, armor, weapons, and other belongings on your person—look different until the spell ends or until you use your action to dismiss it. You can seem 1 foot shorter or taller and can appear thin, fat, or in between. You can\'t change your body type, so you must adopt a form that has the same basic arrangement of limbs. Otherwise, the extent of the illusion is up to you. The changes wrought by this spell fail to hold up to physical inspection.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Expeditious Retreat', level: 1, school: 'Transmutation', castingTime: '1 bonus action', range: 'Self', components: 'V, S', duration: 'Concentration, up to 10 minutes', classes: ['sorcerer', 'warlock', 'wizard'], description: 'Use bonus action to move at double your speed', descriptionFull: 'This spell allows you to move at an incredible pace. When you cast the spell, and then as a bonus action on each of your turns until the spell ends, you can take the Dash action.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Illusory Script', level: 1, school: 'Illusion', castingTime: '1 minute', range: 'Touch', components: 'V, S, M (lead-based inks)', duration: '10 days', classes: ['bard', 'warlock', 'wizard'], description: 'Write a script that is only readable by target creatures', descriptionFull: 'You write text in a mixture of invisible ink and lead-based inks so that it is invisible except under ultraviolet light. You decide whether the script is visible under normal light or only under ultraviolet light. You can also decide that the script only becomes visible if a specific condition is met. Casting this spell takes the same amount of time it takes you to write the text by hand. A creature that can\'t see the text can\'t decipher it, and the script can\'t be copied. If the target of your spell sees the script, they understand the message as if it were written in a language they understand.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },

  // LEVEL 2 SPELLS
  { name: 'Acid Arrow', level: 2, school: 'Evocation', castingTime: '1 action', range: '90 feet', components: 'V, S, M (powdered rhubarb leaf and an adder\'s stomach)', duration: 'Instantaneous', classes: ['wizard'], description: 'Ranged spell attack dealing 4d4 acid damage, 2d4 next round', descriptionFull: 'A shimmering green arrow streaks toward a target within range. Make a ranged spell attack against the target. On a hit, the target takes 4d4 acid damage immediately and 2d4 acid damage at the end of its next turn. On a miss, the arrow splashes the target with acid for half as much of the initial damage only. When you cast this spell using a spell slot of 3rd level or higher, the damage increases by 1d4 for each slot level above 2nd.', concentration: false, ritual: false, damageType: 'Acid', saveType: null, source: 'PHB 2024' },
  { name: 'Aid', level: 2, school: 'Abjuration', castingTime: '1 action', range: '30 feet', components: 'V, S, M (a tiny strip of white cloth)', duration: '8 hours', classes: ['artificer', 'bard', 'cleric', 'paladin'], description: 'Up to 3 creatures gain +5 HP and +5 max HP', descriptionFull: 'Your spell bolsters your allies with toughness and resolve. Choose up to three creatures within range. Each of the chosen creatures gains 5 temporary hit points, and each gains an increase of +1 to their maximum hit points as long as this spell is active. When you cast this spell using a slot of 3rd level or higher, the temporary hit points increase by 5 for each slot level above 2nd.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Blindness/Deafness', level: 2, school: 'Necromancy', castingTime: '1 action', range: '30 feet', components: 'V', duration: '1 minute', classes: ['cleric', 'sorcerer', 'wizard'], description: 'Target makes saving throw or is blinded or deafened', descriptionFull: 'For the spell\'s duration, a creature you choose that you can see within range is either blinded or deafened of your choice. At the end of each of the target\'s turns, it can make a Constitution saving throw. On a success, the spell ends. When you cast this spell using a slot of 3rd level or higher, you can target one additional creature for each slot level above 2nd.', concentration: true, ritual: false, damageType: null, saveType: 'Constitution', source: 'PHB 2024' },
  { name: 'Blur', level: 2, school: 'Illusion', castingTime: '1 action', range: 'Self', components: 'V', duration: 'Concentration, up to 1 minute', classes: ['sorcerer', 'wizard'], description: 'Gain advantage on attack rolls against you', descriptionFull: 'For the duration, your image blurs, making attack rolls against you have disadvantage. An attacker is immune to this effect if it doesn\'t rely on sight, as with blindsight, or can see through illusions, as with truesight.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Darkness', level: 2, school: 'Evocation', castingTime: '1 action', range: '60 feet', components: 'V, M (bat fur and a drop of pitch or piece of coal)', duration: 'Concentration, up to 10 minutes', classes: ['sorcerer', 'warlock', 'wizard'], description: 'Create 15-foot radius of magical darkness', descriptionFull: 'Magical darkness spreads from a point of your choice within range. The darkness spreads around corners. A creature with darkvision can\'t see through this darkness, and nonmagical light doesn\'t illuminate it. If the point you choose is on an object you are holding or one that isn\'t being worn or carried, the darkness emanates from the object and moves with it. Completely covering the source of the darkness with an opaque object blocks the darkness.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Darkvision', level: 2, school: 'Transmutation', castingTime: '1 action', range: 'Touch', components: 'V, S, M (either a pinch of dried carrot or an agate)', duration: '8 hours', classes: ['druid', 'ranger', 'sorcerer', 'wizard'], description: 'Grant creature 60 feet of darkvision', descriptionFull: 'You touch a willing creature to grant it the ability to see in the dark. For the duration, that creature has darkvision out to a range of 60 feet. If the creature already has darkvision, its range increases by 60 feet.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Detect Thoughts', level: 2, school: 'Divination', castingTime: '1 action', range: 'Self', components: 'V, S, M (a copper piece)', duration: 'Concentration, up to 1 minute', classes: ['bard', 'sorcerer', 'wizard'], description: 'Sense the presence of thoughts within 30 feet', descriptionFull: 'For the duration, you can sense the presence of thinking creatures within 30 feet of you. If the creature you sense has an Intelligence score of 3 or lower or doesn\'t speak any language, the creature is unaware of you. Otherwise, the creature knows that you are sensing its emotions when you are tuned to it and has advantage on any saving throw it makes against your spells cast during your next turn before you sense a different creature\'s emotions.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Enhance Ability', level: 2, school: 'Transmutation', castingTime: '1 action', range: 'Touch', components: 'V, S, M (fur or a feather from a beast)', duration: 'Concentration, up to 1 hour', classes: ['artificer', 'bard', 'cleric', 'druid', 'sorcerer', 'wizard'], description: 'Choose ability to grant advantage on ability checks and extra benefits', descriptionFull: 'You touch a creature and bestow an magical enhancement on one ability score of your choice for the duration. The target gains advantage on ability checks made with that ability. If the ability score is Strength, gain +5 bonus on attack rolls and carrying capacity. If Dexterity, gain +5 bonus on attacks with finesse weapons and ranged attacks. If Constitution, gain +5 temporary hit points. If Intelligence, gain +5 bonus on Intelligence (Arcana) checks. If Wisdom, gain +5 bonus on Wisdom (Perception) checks. If Charisma, gain +5 bonus on Charisma (Persuasion) checks.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Enlarge/Reduce', level: 2, school: 'Transmutation', castingTime: '1 action', range: '30 feet', components: 'V, S, M (a pinch of powdered iron)', duration: 'Concentration, up to 1 minute', classes: ['sorcerer', 'wizard'], description: 'Creature becomes twice as large or half as large', descriptionFull: 'You cause a creature or an object you can see within range to grow larger or shrink. For the duration, the target\'s size is doubled or halved in all dimensions, and its weight is multiplied or divided by 8. If the creature cannot move, the spell fails. On a successful save, it can repeat the save at the end of each of its turns, ending the spell on a success.', concentration: true, ritual: false, damageType: null, saveType: 'Constitution', source: 'PHB 2024' },
  { name: 'Hold Person', level: 2, school: 'Enchantment', castingTime: '1 action', range: '60 feet', components: 'V, S, M (a small, straight piece of iron)', duration: 'Concentration, up to 1 minute', classes: ['bard', 'cleric', 'sorcerer', 'warlock', 'wizard'], description: 'Humanoid makes saving throw or is paralyzed', descriptionFull: 'Choose a humanoid that you can see within range. The target must succeed on a Wisdom saving throw or be paralyzed for the duration. At the end of each of the target\'s turns, it can make another Wisdom saving throw. On a success, the spell ends. When you cast this spell using a slot of 3rd level or higher, you can target one additional humanoid for each slot level above 2nd. The humanoids must be within 30 feet of each other when you target them.', concentration: true, ritual: false, damageType: null, saveType: 'Wisdom', source: 'PHB 2024' },
  { name: 'Invisibility', level: 2, school: 'Illusion', castingTime: '1 action', range: 'Touch', components: 'V, S, M (an eyelash encased in gum arabic)', duration: 'Concentration, up to 1 hour', classes: ['bard', 'sorcerer', 'warlock', 'wizard'], description: 'Touch creature becomes invisible', descriptionFull: 'A creature you touch becomes invisible until the spell ends. Anything the target is wearing or carrying is invisible as long as it is on the target\'s person. The spell ends for a target that attacks or casts a spell.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Knock', level: 2, school: 'Transmutation', castingTime: '1 action', range: '60 feet', components: 'V', duration: 'Instantaneous', classes: ['bard', 'sorcerer', 'wizard'], description: 'Open locked doors and containers', descriptionFull: 'Choose an object that you can see within range. The object can be a door, box, chest, lock, chains, or other object that contains a mundane or magical means preventing access. A target that is held shut by a mundane lock or that is stuck or barred becomes unlocked, unstuck, or unbarred. If the object has multiple locks, you open only one lock that you can see. If you choose a target that is held shut with arcane lock, that spell is suppressed for 10 minutes so that the target can be opened and shut normally during that time.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Lesser Restoration', level: 2, school: 'Abjuration', castingTime: '1 action', range: 'Touch', components: 'V, S', duration: 'Instantaneous', classes: ['artificer', 'bard', 'cleric', 'druid', 'paladin', 'ranger'], description: 'End one disease, poison, or condition on a creature', descriptionFull: 'You touch a creature and can end either one disease or one condition afflicting it. The condition can be blinded, deafened, paralyzed, or poisoned.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Levitate', level: 2, school: 'Transmutation', castingTime: '1 action', range: '60 feet', components: 'V, S, M (either a small leather loop or a piece of golden wire bent in a loop and weighing less than 1 ounce)', duration: 'Concentration, up to 10 minutes', classes: ['sorcerer', 'wizard'], description: 'Creature floats and can move vertically', descriptionFull: 'One creature of your choice that you can see within range rises vertically, up to 20 feet, and remains suspended there for the duration. The spell can levitate a target that weighs up to 500 pounds. An unwilling creature that succeeds on a Constitution saving throw is unaffected. The target can move only by pushing or pulling against a fixed object or surface within reach (such as a wall or a ceiling), which allows it to move as if it were climbing.', concentration: true, ritual: false, damageType: null, saveType: 'Constitution', source: 'PHB 2024' },
  { name: 'Mirror Image', level: 2, school: 'Illusion', castingTime: '1 action', range: 'Self', components: 'V, S', duration: 'Concentration, up to 1 minute', classes: ['sorcerer', 'wizard'], description: 'Create 1d4+1 illusory copies of yourself', descriptionFull: 'Three illusory duplicates of yourself appear in your space. Until the spell ends, the duplicates move with you and mimic your actions, shifting position so it\'s impossible to track which image is real. You can use your action to dismiss the illusory duplicates. Each time a creature targets you with an attack during the spell\'s duration, roll a d20 to determine whether the attack instead targets one of your duplicates. If you have three duplicates, you must roll a 6 or higher to change the attack\'s target to a duplicate. With two duplicates, you must roll an 8 or higher. With one duplicate, you must roll an 11 or higher. A duplicate\'s AC is 10 + your Dexterity modifier.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Misty Step', level: 2, school: 'Conjuration', castingTime: '1 bonus action', range: 'Self', components: 'V', duration: 'Instantaneous', classes: ['bard', 'sorcerer', 'warlock', 'wizard'], description: 'Teleport up to 30 feet to an empty space you can see', descriptionFull: 'Briefly surrounded by silvery mist, you teleport up to 30 feet to an unoccupied space that you can see.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Moonbeam', level: 2, school: 'Evocation', castingTime: '1 action', range: '120 feet', components: 'V, S, M (several seeds of any moonseed plant and a piece of opalescent feldspar)', duration: 'Concentration, up to 1 minute', classes: ['druid'], description: 'Create moonlight beam in 5-foot radius, creatures save or take damage', descriptionFull: 'A silvery beam of pale light springs from your hand into a space of your choice within 120 feet. The beam creates a cylinder of moonlight with a 5-foot radius and 40 feet tall centered on that point. Until the spell ends, dim light fills the cylinder. When a creature enters the spell\'s area for the first time on a turn or starts its turn there, it is engulfed in ghostly flames and must make a Constitution saving throw. It takes 2d10 radiant damage on a failed save, or half as much on a successful one. A shapechanger makes its saving throw with disadvantage. If it fails, it also reverts to its original form. If you move the beam as a bonus action, the beam moves 60 feet in the direction you choose.', concentration: true, ritual: false, damageType: 'Radiant', saveType: 'Constitution', source: 'PHB 2024' },
  { name: 'Pass Without Trace', level: 2, school: 'Abjuration', castingTime: '1 action', range: '30 feet', components: 'V, S, M (ashes from a burned leaf of mistletoe and a sprinkle of holy water)', duration: 'Concentration, up to 1 hour', classes: ['druid', 'ranger'], description: 'Up to 5 creatures leave no tracks and are harder to track', descriptionFull: 'A veil of shadows and silence radiates from you. For the duration, each creature you choose within 30 feet of you (including yourself) has advantage on Stealth checks and can\'t be tracked by nonmagical means. Footprints left behind are invisible, and odors left behind fade. If a creature affected by this spell casts a spell, uses an ability, or makes an attack, it loses these benefits until the end of its next turn.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Prayer of Healing', level: 2, school: 'Evocation', castingTime: '10 minutes', range: '30 feet', components: 'V', duration: 'Instantaneous', classes: ['bard', 'cleric'], description: 'Up to 6 creatures within range heal 1d4+CHA mod HP', descriptionFull: 'Up to six creatures of your choice that you can see within range each regain hit points equal to 1d4 + your spellcasting ability modifier. This spell has no effect on undead or constructs. When you cast this spell using a slot of 3rd level or higher, the healing increases by 1d4 for each slot level above 2nd.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Scorching Ray', level: 2, school: 'Evocation', castingTime: '1 action', range: '120 feet', components: 'V, S', duration: 'Instantaneous', classes: ['sorcerer', 'wizard'], description: 'Fire 3 rays of fire each dealing 2d6 fire damage', descriptionFull: 'You create three rays of fire and hurl them at targets within range. You can hurl them at one target or several. Make a ranged spell attack for each ray. On a hit, the target takes 2d6 fire damage. When you cast this spell using a slot of 3rd level or higher, you create one additional ray for each slot level above 2nd.', concentration: false, ritual: false, damageType: 'Fire', saveType: null, source: 'PHB 2024' },
  { name: 'See Invisibility', level: 2, school: 'Divination', castingTime: '1 action', range: 'Self', components: 'V, S, M (a pinch of talc and a small sprinkling of powdered silver)', duration: '1 hour', classes: ['bard', 'sorcerer', 'wizard'], description: 'See invisible creatures and objects', descriptionFull: 'For the duration, you see invisible creatures and objects as if they were visible, and you can see into the Ethereal Plane. Ethereal creatures and objects appear ghostly and translucent.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Shatter', level: 2, school: 'Evocation', castingTime: '1 action', range: '60 feet', components: 'V, S, M (a mica chip)', duration: 'Instantaneous', classes: ['bard', 'sorcerer', 'wizard'], description: 'Creatures in 10-foot radius make saving throw for 3d8 thunder damage', descriptionFull: 'A sudden loud ringing noise, painfully intense, erupts from a point of your choice within range. Each creature in a 10-foot-radius sphere centered on that point must make a Constitution saving throw. A creature takes 3d8 thunder damage on a failed save, or half as much on a successful one. A creature that is holding or wearing something made wholly of glass has disadvantage on the saving throw. When you cast this spell using a slot of 3rd level or higher, the damage increases by 1d8 for each slot level above 2nd.', concentration: false, ritual: false, damageType: 'Thunder', saveType: 'Constitution', source: 'PHB 2024' },
  { name: 'Silence', level: 2, school: 'Illusion', castingTime: '1 action', range: '120 feet', components: 'V, S', duration: 'Concentration, up to 1 minute', classes: ['bard', 'cleric'], description: '20-foot-radius sphere is silent and concentration is impossible', descriptionFull: 'For the duration, no sound can emanate from within a 20-foot-radius sphere centered on a point you choose within range. Any creature or object entirely inside the sphere is immune to thunder damage, and creatures are deafened while entirely inside it. Casting a spell that includes a verbal component is impossible there.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Spider Climb', level: 2, school: 'Transmutation', castingTime: '1 action', range: 'Touch', components: 'V, S, M (a drop of bitumen and a spider)', duration: 'Concentration, up to 1 hour', classes: ['artificer', 'bard', 'sorcerer', 'warlock', 'wizard'], description: 'Creature can climb difficult surfaces and has climbing speed equal to walking speed', descriptionFull: 'Until the spell ends, one willing creature you touch gains the ability to move up, down, and across vertical surfaces and upside down along ceilings, while leaving its hands free. The target also gains a climbing speed equal to its walking speed.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Spiritual Weapon', level: 2, school: 'Evocation', castingTime: '1 bonus action', range: '60 feet', components: 'V, S', duration: 'Concentration, up to 1 minute', classes: ['cleric', 'warlock'], description: 'Conjure spectral weapon attacking creatures you choose', descriptionFull: 'You create a floating, spectral weapon within range that lasts for the duration or until you cast this spell again. When you cast the spell, you can make a melee spell attack against a creature within 5 feet of the weapon. On a hit, the target takes force damage equal to 1d8 + your spellcasting ability modifier. As a bonus action on your turn, you can move the weapon up to 20 feet and repeat the attack against a creature within 5 feet of it. The weapon can\'t be attacked, damaged, or otherwise interacted with by other creatures. At higher levels, the damage increases: at 3rd level (2d8), 5th level (3d8), 7th level (4d8), and 9th level (5d8).', concentration: true, ritual: false, damageType: 'Force', saveType: null, source: 'PHB 2024' },
  { name: 'Suggestion', level: 2, school: 'Enchantment', castingTime: '1 action', range: '30 feet', components: 'V, M (a snake tongue and either a bit of honeycomb or a drop of sweet oil)', duration: 'Concentration, up to 8 hours', classes: ['bard', 'sorcerer', 'warlock', 'wizard'], description: 'Plant a reasonable-sounding course of action in target\'s mind', descriptionFull: 'You suggest a course of activity (limited to a sentence or two) and magically influence a creature you can see within range that can hear and understand you. Creatures that can\'t be charmed are immune to this effect. The suggestion must be worded in such a manner as to make the course of action sound reasonable. Asking the creature to stab itself, throw itself onto a spear, immolate itself, or do some other obviously harmful act ends the spell. The target must make a Wisdom saving throw. On a failed save, it pursues the course of action you described to the best of its ability.', concentration: true, ritual: false, damageType: null, saveType: 'Wisdom', source: 'PHB 2024' },
  { name: 'Crown of Madness', level: 2, school: 'Enchantment', castingTime: '1 action', range: '120 feet', components: 'V, S', duration: 'Concentration, up to 1 minute', classes: ['bard', 'sorcerer', 'warlock', 'wizard'], description: 'Target makes saving throw or uses reaction to attack nearest creature', descriptionFull: 'One humanoid of your choice that you can see within range must succeed on a Wisdom saving throw or become charmed by you for the duration. While the target is charmed in this way, a twisted crown of jagged iron appears on its head, and a madness glows in its eyes. The charmed creature must use its action before moving on each of its turns to make a melee attack against a creature other than itself that you mentally choose. The creature will attack the target you pick or pick the nearest creature to it if you don\'t specify.', concentration: true, ritual: false, damageType: null, saveType: 'Wisdom', source: 'PHB 2024' },
  { name: 'Warding Bond', level: 2, school: 'Abjuration', castingTime: '1 action', range: 'Touch', components: 'V, S, M (a pair of platinum rings worth at least 50 gp each, which you and the target must wear for the duration)', duration: '1 hour', classes: ['cleric', 'paladin'], description: 'Linked creature gains benefits and shares damage with you', descriptionFull: 'This spell wards a willing creature you touch and creates a mystic connection between you and the target so you feel each other\'s pain. While the target is within 60 feet of you, it gains a +1 bonus to AC and saving throws, and it has resistance to all damage. Also, each time it takes damage, you take the same amount of damage. The spell ends if you drop to 0 hit points or if you and the target become more than 60 feet apart.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },

  // LEVEL 3+ SPELLS (abbreviated for space)
  { name: 'Fireball', level: 3, school: 'Evocation', castingTime: '1 action', range: '150 feet', components: 'V, S, M (a tiny ball of bat guano and sulfur)', duration: 'Instantaneous', classes: ['sorcerer', 'wizard'], description: 'Creatures in 20-foot radius sphere make saving throw for 8d6 fire damage', descriptionFull: 'A bright streak flashes from your pointing finger to a point of your choice within range then blossoms with a low roar into an explosion of flame. Each creature in a 20-foot-radius sphere centered on that point must make a Dexterity saving throw. A target takes 8d6 fire damage on a failed save, or half as much on a successful one. The fire spreads around corners. It ignites flammable objects in the area that aren\'t being worn or carried. When you cast this spell using a slot of 4th level or higher, the damage increases by 1d6 for each slot level above 3rd.', concentration: false, ritual: false, damageType: 'Fire', saveType: 'Dexterity', source: 'PHB 2024' },
  { name: 'Counterspell', level: 3, school: 'Abjuration', castingTime: '1 reaction', range: '60 feet', components: 'S', duration: 'Instantaneous', classes: ['sorcerer', 'warlock', 'wizard'], description: 'Interrupt a spell you see a creature casting', descriptionFull: 'You attempt to interrupt a creature in the process of casting a spell. If the creature is casting a spell of 3rd level or lower, its spell fails and has no effect. If it is casting a spell of 4th level or higher, make an ability check using your spellcasting ability. The DC equals 10 + the spell\'s level. On a success, the creature\'s spell fails and has no effect. When you cast this spell using a slot of 4th level or higher, you can counterspell a spell of that level or lower.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Dispel Magic', level: 3, school: 'Abjuration', castingTime: '1 action', range: '120 feet', components: 'V, S', duration: 'Instantaneous', classes: ['artificer', 'bard', 'cleric', 'druid', 'paladin', 'ranger', 'sorcerer', 'warlock', 'wizard'], description: 'End one spell affecting a creature or object', descriptionFull: 'Choose one creature, object, or magical effect within range. Any spell of 3rd level or lower on the target ends. For each spell of 4th level or higher on the target, make an ability check using your spellcasting ability. The DC equals 10 + the spell\'s level. On a successful check, the spell ends. When you cast this spell using a slot of 4th level or higher, you can end one spell of that level or lower.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Lightning Bolt', level: 3, school: 'Evocation', castingTime: '1 action', range: 'Self (100-foot line)', components: 'V, S, M (a bit of fur and a rod of amber, crystal, or glass)', duration: 'Instantaneous', classes: ['sorcerer', 'wizard'], description: 'Creatures in 100-foot line make saving throw for 8d6 lightning damage', descriptionFull: 'A stroke of lightning forming a line 100 feet long and 5 feet wide blasts out from you in a direction you choose. Each creature in that line must make a Dexterity saving throw. A creature takes 8d6 lightning damage on a failed save, or half as much on a successful one. The lightning ignites flammable objects in the area that aren\'t being worn or carried. When you cast this spell using a slot of 4th level or higher, the damage increases by 1d6 for each slot level above 3rd.', concentration: false, ritual: false, damageType: 'Lightning', saveType: 'Dexterity', source: 'PHB 2024' },
  { name: 'Haste', level: 3, school: 'Transmutation', castingTime: '1 action', range: '30 feet', components: 'V, S, M (a shaving of licorice root)', duration: 'Concentration, up to 1 minute', classes: ['sorcerer', 'wizard'], description: 'Target gains doubled speed, +2 AC, extra action each turn', descriptionFull: 'Choose a willing creature that you can see within range. Until the spell ends, the target\'s speed is doubled, it gains a +2 bonus to AC, it has advantage on Dexterity saving throws, and it gains an additional action on each of its turns. That action can be used only to take the Attack (one weapon attack only), Dash, Disengage, Dodge, or Hide action. When the spell ends, the target can\'t move or use actions at all until after its next turn, as a wave of lethargy sweeps over it.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Mass Healing Word', level: 3, school: 'Evocation', castingTime: '1 bonus action', range: '60 feet', components: 'V', duration: 'Instantaneous', classes: ['cleric'], description: 'Up to 6 creatures heal 1d4+WIS mod hit points', descriptionFull: 'As you call out words of restoration, up to six creatures of your choice that you can see within range regain hit points equal to 1d4 + your spellcasting ability modifier. This spell has no effect on undead or constructs. When you cast this spell using a slot of 4th level or higher, the healing increases by 1d4 for each slot level above 3rd.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Spirit Guardians', level: 3, school: 'Conjuration', castingTime: '1 action', range: 'Self (15-foot radius)', components: 'V, S, M (a holy symbol)', duration: 'Concentration, up to 10 minutes', classes: ['cleric'], description: 'Summon spirits in 15-foot radius, creatures save or take 3d8 radiant damage', descriptionFull: 'You call forth spirits to protect you. They flit around you to a distance of 15 feet for the duration. If you are good or neutral, their spectral form appears angelic or fey (your choice). If you are evil, they appear fiendish. When you cast this spell and as a bonus action on subsequent turns, you can move the spirits up to 60 feet and choose creatures in that area to attack. A target must make a Wisdom saving throw. On a failed save, it takes 3d8 radiant damage (if you are good or neutral) or 3d8 necrotic damage (if you are evil). On a successful save, it takes half as much damage. At higher levels, the damage increases by 1d8 when you reach 5th level (4d8), 7th level (5d8), and 9th level (6d8).', concentration: true, ritual: false, damageType: 'Radiant/Necrotic', saveType: 'Wisdom', source: 'PHB 2024' },
  { name: 'Revivify', level: 3, school: 'Necromancy', castingTime: '1 action', range: 'Touch', components: 'V, S, M (diamonds worth 300 gp)', duration: 'Instantaneous', classes: ['cleric', 'paladin'], description: 'Return a dead creature to life if it died within 1 minute', descriptionFull: 'You touch a creature that has been dead for no longer than 1 minute. That creature returns to life with 1 hit point. This spell can\'t return to life a creature that died of old age, nor can it restore any missing body parts.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Fly', level: 3, school: 'Transmutation', castingTime: '1 action', range: 'Touch', components: 'V, S, M (a feather from any bird)', duration: 'Concentration, up to 10 minutes', classes: ['sorcerer', 'warlock', 'wizard'], description: 'Creature gains flying speed of 60 feet', descriptionFull: 'You touch a willing creature. The target gains a flying speed of 60 feet for the duration. When the spell ends, the target falls if it is still aloft, unless it can stop the fall. When you cast this spell using a slot of 4th level or higher, you can target one additional creature for each slot level above 3rd.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Invisibility (Greater)', level: 4, school: 'Illusion', castingTime: '1 action', range: 'Touch', components: 'V, S, M (an eyelash encased in chrysoberyl)', duration: 'Concentration, up to 1 minute', classes: ['bard', 'sorcerer', 'wizard'], description: 'Target becomes invisible, attacks don\'t break it', descriptionFull: 'You or a creature you touch becomes invisible until the spell ends. Anything the target is wearing or carrying is invisible as long as it is on the target\'s person. The spell ends if the target attacks or casts a spell. Unlike regular Invisibility, this version allows spellcasting and attacking without breaking the invisibility.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Polymorph', level: 4, school: 'Transmutation', castingTime: '1 action', range: '60 feet', components: 'V, S, M (a caterpillar cocoon)', duration: 'Concentration, up to 1 hour', classes: ['bard', 'druid', 'sorcerer', 'wizard'], description: 'Transform a creature into another beast', descriptionFull: 'This spell transforms a creature that you can see within range into a new form. An unwilling creature must make a Wisdom saving throw to avoid the effect. The transformation lasts for the duration, or until the target drops to 0 hit points or dies. You can use your action to dismiss the transformation early. The creature is limited to the CR of the original form (or lower) and retains its alignment and personality.', concentration: true, ritual: false, damageType: null, saveType: 'Wisdom', source: 'PHB 2024' },
  { name: 'Wall of Fire', level: 4, school: 'Evocation', castingTime: '1 action', range: '120 feet', components: 'V, S, M (a flare of light)', duration: 'Concentration, up to 1 minute', classes: ['druid', 'sorcerer', 'wizard'], description: 'Create wall of fire, creatures passing through take damage', descriptionFull: 'You create a wall of fire on a solid surface within range. You can make the wall up to 60 feet long, 20 feet high, and 1 foot thick, or a ringed wall up to 60 feet in diameter, 20 feet high, and 1 foot thick. The wall is opaque and lasts for the duration. When a creature enters the wall\'s space for the first time on a turn or starts its turn there, the creature must make a Dexterity saving throw. On a failed save, it takes 5d8 fire damage, or half as much on a successful save.', concentration: true, ritual: false, damageType: 'Fire', saveType: 'Dexterity', source: 'PHB 2024' },
  { name: 'Blight', level: 4, school: 'Necromancy', castingTime: '1 action', range: '30 feet', components: 'V, S', duration: 'Instantaneous', classes: ['druid', 'sorcerer', 'wizard'], description: 'Wither plant life or deal necrotic damage to creature', descriptionFull: 'Necromantic energy washes over a creature of your choice that you can see within range. The target must make a Constitution saving throw. On a failed save, it takes 8d8 necrotic damage (plants make this save with disadvantage), or half as much on a successful save. This spell has no effect on undead or constructs. If you target a plant creature or a magical plant, it has disadvantage on the saving throw.', concentration: false, ritual: false, damageType: 'Necrotic', saveType: 'Constitution', source: 'PHB 2024' },
