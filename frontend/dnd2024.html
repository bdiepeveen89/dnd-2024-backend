  { name: 'Dimension Door', level: 4, school: 'Conjuration', castingTime: '1 action', range: 'Self', components: 'V', duration: 'Instantaneous', classes: ['bard', 'sorcerer', 'warlock', 'wizard'], description: 'Teleport up to 500 feet to a space you can see', descriptionFull: 'You teleport yourself from your current location to any other spot within range. You arrive at exactly the spot desired. It can be a place you can see, one you can visualize, or one you can describe by stating distance and direction. For example, "200 feet straight downward" or "300 feet northeast." If you would arrive in a place occupied by an object or a creature, you and any creature traveling with you instead arrive in the nearest unoccupied space to the target. When you cast this spell using a slot of 5th level or higher, you can target one additional creature for each slot level above 4th. A creature must be within 5 feet of you and willing, or it must make a Charisma saving throw (in which case it can choose to fail).', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Conjure Elemental', level: 5, school: 'Conjuration', castingTime: '1 minute', range: '90 feet', components: 'V, S, M (burning incense for air, soft clay for earth, salt water for water, charcoal for fire)', duration: 'Concentration, up to 1 hour', classes: ['druid', 'sorcerer', 'wizard'], description: 'Summon an elemental and command it', descriptionFull: 'You call forth an elemental servant. Choose an area of air, earth, fire, or water that fills a 10-foot cube within range. An appropriate elemental appears in an unoccupied space within 10 feet of it. It has the statistics of an air elemental, earth elemental, fire elemental, or water elemental (your choice) and acts on your initiative. It obeys any verbal commands that you issue to it (no action required by you). If you don\'t issue any commands to the elemental, it defends itself from hostile creatures but otherwise takes no actions. The elemental disappears when it drops to 0 hit points or when the spell ends.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Cloudkill', level: 5, school: 'Conjuration', castingTime: '1 action', range: '120 feet', components: 'V, S', duration: 'Concentration, up to 10 minutes', classes: ['sorcerer', 'wizard'], description: 'Create poisonous cloud that kills lower level creatures instantly', descriptionFull: 'A 20-foot-radius sphere of poisonous yellow-green fog spreads from a point of your choice within range. The fog spreads around corners. It lasts for the duration or until strong wind disperses the fog. Each creature that starts its turn in the fog must make a Constitution saving throw. On a failed save, the creature takes 5d8 poison damage (creatures with 0 hit points are killed instantly instead of taking damage).', concentration: true, ritual: false, damageType: 'Poison', saveType: 'Constitution', source: 'PHB 2024' },
  { name: 'Cone of Cold', level: 5, school: 'Evocation', castingTime: '1 action', range: 'Self (60-foot cone)', components: 'V, S, M (a small crystal or glass cone)', duration: 'Instantaneous', classes: ['sorcerer', 'wizard'], description: 'Creatures in 60-foot cone make saving throw for 8d8 cold damage', descriptionFull: 'A blast of cold air springs from your hands. Each creature in a 60-foot cone must make a Constitution saving throw. A target takes 8d8 cold damage on a failed save, or half as much on a successful one. A creature killed by this spell becomes a frozen statue until it thaws. When you cast this spell using a slot of 6th level or higher, the damage increases by 1d8 for each slot level above 5th.', concentration: false, ritual: false, damageType: 'Cold', saveType: 'Constitution', source: 'PHB 2024' },
  { name: 'Telekinesis', level: 5, school: 'Transmutation', castingTime: '1 action', range: '60 feet', components: 'V, S', duration: 'Concentration, up to 10 minutes', classes: ['sorcerer', 'wizard'], description: 'Move objects or creatures with your mind', descriptionFull: 'You gain the ability to move or manipulate creatures or objects by thought. When you cast the spell and as your action each round for the duration, you can exert fine control on creatures or objects within range. You can use your action to try to move a creature with an Intelligence score of 3 or lower or move an object that isn\'t being worn or carried, if the total weight of objects is 1,000 pounds or less. If the target is a creature, it must make a Strength saving throw.', concentration: true, ritual: false, damageType: null, saveType: 'Strength', source: 'PHB 2024' },
  { name: 'Wall of Force', level: 5, school: 'Evocation', castingTime: '1 action', range: '120 feet', components: 'V, S, M (a pinch of powder made by crushing a clear pebble)', duration: 'Concentration, up to 10 minutes', classes: ['wizard'], description: 'Create invisible wall of force', descriptionFull: 'An invisible wall of force comes into being at a point you choose within range. The wall appears in any orientation you choose, as a horizontal or vertical barrier or at an angle. It can be up to 10 feet long, 10 feet high, and 1 foot thick, or you can shape it into a sphere up to 15 feet in diameter. The wall is immune to all damage and can\'t be penetrated by any physical means.', concentration: true, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Chain Lightning', level: 6, school: 'Evocation', castingTime: '1 action', range: '150 feet', components: 'V, S, M (a piece of glass or a glass bead)', duration: 'Instantaneous', classes: ['sorcerer', 'wizard'], description: 'Lightning chains between creatures dealing 10d8 damage', descriptionFull: 'You create a bolt of lightning that arcs from a creature of your choice that you can see within range to up to three other creatures, each of which must be within 30 feet of the first target and different from the others. A creature must make a Dexterity saving throw. The creature takes 10d8 lightning damage on a failed save, or half as much on a successful one. When you cast this spell using a slot of 7th level or higher, one additional creature is chained for each slot level above 6th.', concentration: false, ritual: false, damageType: 'Lightning', saveType: 'Dexterity', source: 'PHB 2024' },
  { name: 'Heal', level: 6, school: 'Evocation', castingTime: '1 action', range: '60 feet', components: 'V, S', duration: 'Instantaneous', classes: ['bard', 'cleric', 'druid'], description: 'Restore 70 hit points to a creature and remove conditions', descriptionFull: 'Choose a creature that you can see within range. A surge of positive energy washes through the creature, causing it to regain 70 hit points. This spell also ends blindness, deafness, and any diseases affecting the target. This spell has no effect on undead or constructs. When you cast this spell using a slot of 7th level or higher, the amount of healing increases by 10 for each slot level above 6th.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' },
  { name: 'Sunbeam', level: 6, school: 'Evocation', castingTime: '1 action', range: 'Self (60-foot line)', components: 'V, S, M (a magnifying glass)', duration: 'Concentration, up to 1 minute', classes: ['cleric', 'druid', 'sorcerer', 'wizard'], description: 'Beam of sunlight burns creatures, undead take extra damage', descriptionFull: 'A beam of brilliant sunlight springs from your hand in a 5-foot-wide, 60-foot-long line. Each creature in the line must make a Constitution saving throw. On a failed save, a creature takes 6d8 radiant damage and is blinded until the end of its next turn. On a successful save, it takes half as much damage and isn\'t blinded. Undead and oozes have disadvantage on this saving throw. A creature that is totally covered by opaque material is unaffected by the beam.', concentration: true, ritual: false, damageType: 'Radiant', saveType: 'Constitution', source: 'PHB 2024' },
  { name: 'Wish', level: 9, school: 'Conjuration', castingTime: '1 action', range: 'Self', components: 'V', duration: 'Instantaneous', classes: ['sorcerer', 'wizard'], description: 'Alter reality in any way you wish', descriptionFull: 'Wish is the mightiest spell a mortal creature can cast. By simply speaking aloud, you can alter the very foundations of reality in accord with your desires. The basic use of the spell is to duplicate the effects of any other spell of 8th level or lower. You simply state what magical effect you wish to create, and the spell produces it. An instantaneous spell that targets one or more creatures of your choice doesn\'t require you to make an attack roll or them to make a saving throw. This spell might simply open an otherwise locked door, assuming the door is within the spell\'s range and there is no magical lock preventing access. It might force a question truthfully answered. You could prevent a creature from dying, create a magical item, or do other things of comparable scope.', concentration: false, ritual: false, damageType: null, saveType: null, source: 'PHB 2024' }
];

// ============================================================================
// DATA NORMALIZATION - Adds missing fields and normalizes data format
// ============================================================================

function normalizeData() {
  const RACE_META = {
    'Aasimar': { color: '#f8c8d4', icon: '👼', lifespan: '~160 jaar' },
    'Dragonborn': { color: '#c0392b', icon: '🐉', lifespan: '~80 jaar' },
    'Dwarf': { color: '#8B6914', icon: '⛏️', lifespan: '~350 jaar' },
    'Elf': { color: '#27ae60', icon: '🏹', lifespan: '~750 jaar' },
    'Gnome': { color: '#f39c12', icon: '🔧', lifespan: '~500 jaar' },
    'Goliath': { color: '#7f8c8d', icon: '⛰️', lifespan: '~100 jaar' },
    'Halfling': { color: '#d35400', icon: '🌿', lifespan: '~150 jaar' },
    'Human': { color: '#3498db', icon: '🧑', lifespan: '~80 jaar' },
    'Orc': { color: '#2ecc71', icon: '💪', lifespan: '~60 jaar' },
    'Tiefling': { color: '#8e44ad', icon: '😈', lifespan: '~110 jaar' }
  };
  if (!window.DND_DATA) { window.DND_DATA = { races: [], classes: [], backgrounds: [], alignments: [], spells: [], monsters: [], equipment: [], skills: [] }; }
  // Normalize races
  DND_DATA.races = (DND_DATA.races || []).map((race) => {
    const meta = RACE_META[race.name] || { color: '#666', icon: '👤', lifespan: '~80 jaar' };
    return {
      ...race,
      id: race.id || race.name.toLowerCase().replace(/\s+/g, '-'),
      color: race.color || meta.color,
      icon: race.icon || meta.icon,
      lifespan: race.lifespan || meta.lifespan,
      traits: Array.isArray(race.traits) ? race.traits.map(t => typeof t === 'string' ? { name: t, description: t } : t) : []
    };
  });
  // Normalize classes
  DND_DATA.classes = (DND_DATA.classes || []).map(cls => ({
    ...cls,
    id: cls.id || cls.name.toLowerCase().replace(/\s+/g, '-'),
    spellcaster: cls.isSpellcaster !== undefined ? cls.isSpellcaster : (cls.spellcaster || false),
    hitDice: cls.hitDice || cls.hitDie || 8
  }));
  // Normalize backgrounds
  DND_DATA.backgrounds = (DND_DATA.backgrounds || []).map(bg => ({
    ...bg,
    id: bg.id || bg.name.toLowerCase().replace(/\s+/g, '-')
  }));
  // Normalize spells
  DND_DATA.spells = (DND_DATA.spells || []).map(spell => ({
    ...spell,
    id: spell.id || spell.name.toLowerCase().replace(/[^a-z0-9]/g, '-'),
    level: typeof spell.level === 'number' ? spell.level : parseInt(spell.level) || 0,
    classes: spell.classes || []
  }));
  // Normalize monsters
  DND_DATA.monsters = (DND_DATA.monsters || []).map(monster => ({
    ...monster,
    id: monster.id || monster.name.toLowerCase().replace(/[^a-z0-9]/g, '-')
  }));
  // Add skills if missing
  if (!DND_DATA.skills || DND_DATA.skills.length === 0) {
    DND_DATA.skills = [
      { name: 'Acrobatics', ability: 'DEX' }, { name: 'Animal Handling', ability: 'WIS' },
      { name: 'Arcana', ability: 'INT' }, { name: 'Athletics', ability: 'STR' },
      { name: 'Deception', ability: 'CHA' }, { name: 'History', ability: 'INT' },
      { name: 'Insight', ability: 'WIS' }, { name: 'Intimidation', ability: 'CHA' },
      { name: 'Investigation', ability: 'INT' }, { name: 'Medicine', ability: 'WIS' },
      { name: 'Nature', ability: 'INT' }, { name: 'Perception', ability: 'WIS' },
      { name: 'Performance', ability: 'CHA' }, { name: 'Persuasion', ability: 'CHA' },
      { name: 'Religion', ability: 'INT' }, { name: 'Sleight of Hand', ability: 'DEX' },
      { name: 'Stealth', ability: 'DEX' }, { name: 'Survival', ability: 'WIS' }
    ];
  }
}

function initTheme() {
  const savedTheme = localStorage.getItem('dnd_theme') || 'dark';
  AppState.theme = savedTheme;
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeToggle();
}

function setupEventListeners() {
  // Dice roller
  document.getElementById('dice-toggle-btn').addEventListener('click', toggleDicePanel);
  document.getElementById('close-dice-panel').addEventListener('click', () => {
    document.getElementById('dice-roller-panel').style.display = 'none';
  });
  document.getElementById('roll-btn').addEventListener('click', rollDiceHandler);
  
  document.querySelectorAll('.dice-quick-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.getElementById('dice-notation').value = e.target.dataset.dice;
    });
  });

  // Theme toggle
  const themeToggle = document.querySelector('.theme-toggle-btn');
  if (themeToggle) {
    themeToggle.addEventListener('click', toggleTheme);
  }
}

// ============================================================================

const VALID_USERS = {
  'dm': 'dungeon123',
  'player': 'player123'
};

function checkAuth() {
  const savedUser = localStorage.getItem('dnd_user');
  if (savedUser) {
    AppState.currentUser = JSON.parse(savedUser);
    renderApp();
  } else {
    renderLoginPage();
  }
}

function login(username, password) {
  if (VALID_USERS[username] && VALID_USERS[username] === password) {
    AppState.currentUser = { username, loginTime: new Date().toISOString() };
    localStorage.setItem('dnd_user', JSON.stringify(AppState.currentUser));
    renderApp();
    showToast(`Welkom terug, ${username}!`, 'success');
    return true;
  } else {
    showToast('Invalid username or password', 'error');
    return false;
  }
}

function logout() {
  AppState.currentUser = null;
  localStorage.removeItem('dnd_user');
  checkAuth();
  showToast('Je bent afgemeld', 'info');
}

// ============================================================================

function navigateTo(view, params = {}) {
  AppState.currentView = view;
  
  // Update active sidebar item
  document.querySelectorAll('.sidebar-nav-item').forEach(btn => {
    btn.classList.remove('active');
    if (btn.dataset.view === view) {
      btn.classList.add('active');
    }
  });

  const contentArea = document.getElementById('main-content');
  
  switch (view) {
    case 'dashboard':
      renderDashboard();
      break;
    case 'characters':
      renderCharactersList();
      break;
    case 'character-builder':
      renderCharacterBuilder();
      break;
    case 'character-sheet':
      if (AppState.selectedCharacter) {
        renderCharacterSheet();
      } else {
        showToast('No character selected', 'error');
        navigateTo('characters');
      }
      break;
    case 'spellbook':
      renderSpellbook();
      break;
    case 'monsters':
      renderMonsterManual();
      break;
    case 'campaigns':
      renderCampaigns();
      break;
    case 'rules':
      renderRulesReference();
      break;
    case 'homebrew':
      renderHomebrew();
      break;
    default:
      renderDashboard();
  }
}

function deleteCharacter(characterId) {
  if (confirm('Are you sure you want to delete this character?')) {
    AppState.characters = AppState.characters.filter(c => c.id !== characterId);

    showToast('Character deleted', 'success');

  if (!grid) { renderCharacterBuilder(); return; }

  var q = AppState.characterBuilder.raceSearch.toLowerCase();
  var selected = AppState.characterBuilder.race;

  var filtered = DND_DATA.races.filter(function(r) {
    return !q || r.name.toLowerCase().indexOf(q) >= 0 ||
      (r.traits || []).some(function(t) {
        var txt = typeof t === 'string' ? t : (t.name || '') + ' ' + (t.description || '');
        return txt.toLowerCase().indexOf(q) >= 0;
      });
  });

  if (countEl) countEl.textContent = filtered.length + ' races';

  if (searchInput && val !== undefined) {
    searchInput.value = val;
    searchInput.focus();
    var len = searchInput.value.length;
    searchInput.setSelectionRange(len, len);
  }

  grid.innerHTML = filtered.map(function(race) {
    var isSelected = selected && selected.id === race.id;
    var style = isSelected ? 'border-color:var(--accent-green);box-shadow:0 0 15px rgba(0,184,148,0.3);' : '';
    var cls = isSelected ? 'border-2' : '';
    var traitsHtml = (race.traits || []).slice(0, 2).map(function(t) {
      return '<p style="margin:var(--spacing-xs) 0;">\u2022 ' + (typeof t === 'string' ? t : t.name) + '</p>';
    }).join('');
    var raceId = race.id;
    return '<div class="card card-clickable ' + cls + '" style="' + style + '" onclick="selectRace(\'' + raceId + '\')">'
      + '<h3 style="margin:0 0 var(--spacing-md);color:var(--accent-green);">' + race.name + '</h3>'
      + '<div style="color:var(--text-secondary);margin-bottom:var(--spacing-md);font-size:0.9rem;">'
      + '<p style="margin:var(--spacing-sm) 0;"><strong>Speed:</strong> ' + race.speed + ' ft</p>'
      + '<p style="margin:var(--spacing-sm) 0;"><strong>Size:</strong> ' + race.size + '</p>'
      + '<p style="margin:var(--spacing-sm) 0;"><strong>Levensduur:</strong> ' + race.lifespan + '</p>'
      + '</div>'
      + '<div style="background:var(--bg-secondary);border-radius:var(--radius-md);padding:var(--spacing-md);font-size:0.85rem;color:var(--text-muted);">' + traitsHtml + '</div>'
      + '</div>';
  }).join('');
}

function filterBackgrounds(val) {
  AppState.characterBuilder.backgroundSearch = (val !== undefined ? val : '');
  var grid = document.getElementById('background-grid');
  var searchInput = document.getElementById('bg-search-input');

  if (!grid) { renderCharacterBuilder(); return; }

  var q = AppState.characterBuilder.backgroundSearch.toLowerCase();
  var selected = AppState.characterBuilder.background;

  var filtered = DND_DATA.backgrounds.filter(function(bg) {
    return !q || bg.name.toLowerCase().indexOf(q) >= 0 ||
      (bg.description || '').toLowerCase().indexOf(q) >= 0;
  });

  if (searchInput && val !== undefined) {
    searchInput.value = val;
    searchInput.focus();
    var len = searchInput.value.length;
    searchInput.setSelectionRange(len, len);
  }

  grid.innerHTML = filtered.map(function(bg) {
    var isSelected = selected && selected.id === bg.id;
    var borderStyle = isSelected
      ? 'border:2px solid var(--accent-green);box-shadow:0 0 12px rgba(0,184,148,0.3);'
      : 'border:1px solid var(--border-color);';
    var cls = isSelected ? 'selected-card' : '';
    var skills = Array.isArray(bg.skills) ? bg.skills.join(', ')
      : (bg.skillProficiencies ? bg.skillProficiencies.join(', ') : '\u2014');
    var featHtml = bg.feat
      ? '<p style="font-size:0.82rem;color:var(--text-muted);margin:0;">'
        + '<i class="fas fa-star" style="color:var(--accent-gold);width:14px;"></i>'
        + ' <strong>Feat:</strong> ' + bg.feat + '</p>'
      : '';
    var desc = (bg.description || '').substring(0, 80)
      + ((bg.description || '').length > 80 ? '\u2026' : '');
    return '<div class="card card-clickable ' + cls + '" style="' + borderStyle + '" onclick="selectBackground(\'' + bg.id + '\')">'
      + '<h4 style="margin:0 0 6px;color:var(--accent-green);">' + bg.name + '</h4>'
      + '<p style="font-size:0.82rem;color:var(--text-secondary);margin:0 0 6px;">'
        + '<i class="fas fa-book" style="color:var(--text-muted);width:14px;"></i>'
        + ' <strong>Skills:</strong> ' + skills + '</p>'
      + featHtml
      + '<p style="font-size:0.8rem;color:var(--text-muted);margin:6px 0 0;line-height:1.4;">' + desc + '</p>'
      + '</div>';
  }).join('');
}

function selectSubclassByName(name) {
  var cls = AppState.characterBuilder.class;
  if (!cls) return;
  var sc = (cls.subclasses || []).find(function(s) { return s.name === name; });
  if (sc) {
    AppState.characterBuilder.subclass = sc;
    renderCharacterBuilder();
  }
}

function toggleInfusionByName(name, maxKnown) {
  var inf = ARTIFICER_INFUSIONS.find(function(i) { return i.name === name; });
  if (!inf) return;
  if (!Array.isArray(AppState.characterBuilder.infusions)) AppState.characterBuilder.infusions = [];
  var list = AppState.characterBuilder.infusions;
  var idx = list.findIndex(function(s) { return s.name === name; });
  if (idx > -1) {
    list.splice(idx, 1);
  } else {
    if (list.length >= maxKnown) {
      showToast('Maximum aantal infusions bereikt (' + maxKnown + ')', 'warning');
      return;
    }
    list.push(inf);
  }
  renderCharacterBuilder();
}

  const lvl = AppState.characterBuilder.level || 1;

  const levelPicker = `
    <div style="background:var(--bg-secondary);border-radius:var(--radius-lg);padding:var(--spacing-lg);margin-top:var(--spacing-xl);border:1px solid var(--border-color);">

          <button onclick="setCharLevel(${l})" style="padding:8px 4px;border:2px solid ${l===lvl?'var(--accent-green)':'var(--border-color)'};border-radius:var(--radius-md);background:${l===lvl?'rgba(0,184,148,0.15)':'var(--bg-card)'};color:${l===lvl?'var(--accent-green)':'var(--text-primary)'};font-weight:${l===lvl?'700':'400'};cursor:pointer;font-size:0.9rem;transition:all 0.15s;">
            ${l}
          </button>
        `).join('')}
      </div>
      <div style="display:flex;gap:var(--spacing-lg);flex-wrap:wrap;font-size:0.9rem;color:var(--text-secondary);">
        <span><i class="fas fa-shield-alt" style="color:var(--accent-green);margin-right:4px;"></i><strong>Proficiency Bonus:</strong> +${profBonus(lvl)}</span>
        ${selClass ? `<span><i class="fas fa-heart" style="color:var(--accent-red);margin-right:4px;"></i><strong>Estimated HP:</strong> ${estimateHP(selClass, lvl)}</span>` : ''}
        ${lvl >= 5 && selClass && ['Fighter','Monk','Paladin','Ranger','Barbarian'].includes(selClass.name) ? '<span style="color:var(--accent-gold);"><i class="fas fa-swords" style="margin-right:4px;"></i><strong>Extra Attack</strong> unlocked</span>' : ''}
      </div>
    </div>`;

  const subclassPicker = (selClass && lvl >= 3 && selClass.subclasses && selClass.subclasses.length) ? `
    <div style="background:var(--bg-secondary);border-radius:var(--radius-lg);padding:var(--spacing-lg);margin-top:var(--spacing-xl);border:1px solid rgba(255,193,7,0.3);">
      <h3 style="margin:0 0 var(--spacing-md);color:var(--text-primary);">
        <i class="fas fa-book-open" style="color:var(--accent-gold);margin-right:8px;"></i>Subclass
        <span style="font-size:0.8rem;font-weight:400;color:var(--text-muted);margin-left:10px;">Choose your specialization (level 3)</span>
        ${selSubclass ? '<span style="color:var(--accent-green);font-size:0.85rem;margin-left:10px;"><i class="fas fa-check"></i> ' + selSubclass.name + '</span>' : '<span style="color:var(--text-muted);font-size:0.8rem;margin-left:8px;">(optional)</span>'}
      </h3>
      <div class="grid grid-2">
        ${selClass.subclasses.map(sc => `
          <div class="card card-clickable ${selSubclass && selSubclass.name === sc.name ? 'selected-card' : ''}"
               style="${selSubclass && selSubclass.name === sc.name ? 'border:2px solid var(--accent-gold);box-shadow:0 0 12px rgba(255,193,7,0.25);' : 'border:1px solid var(--border-color);'}"
               onclick="selectSubclassByName('${sc.name}')">
            <h4 style="margin:0 0 6px;color:var(--accent-gold);">${sc.name}</h4>
            <p style="font-size:0.82rem;color:var(--text-muted);margin:0;line-height:1.4;">${sc.description}</p>
          </div>
        `).join('')}
      </div>
    </div>` : '';

  const isArtificer = selClass && selClass.name === 'Artificer';
  const knownInfusions = isArtificer ? Math.min(2 + Math.floor((lvl - 2) / 2) * 2, 12) : 0;
  const infusionPicker = (isArtificer && lvl >= 2) ? `
    <div style="background:var(--bg-secondary);border-radius:var(--radius-lg);padding:var(--spacing-lg);margin-top:var(--spacing-xl);border:1px solid rgba(91,155,213,0.3);">
      <h3 style="margin:0 0 4px;color:var(--text-primary);">
        <i class="fas fa-cog" style="color:#5b9bd5;margin-right:8px;"></i>Artificer Infusions
        <span style="font-size:0.8rem;font-weight:400;color:var(--text-muted);margin-left:10px;">You know ${knownInfusions} infusions</span>
        ${selInfusions.length > 0 ? '<span style="color:#5b9bd5;font-size:0.85rem;margin-left:8px;"><i class="fas fa-check"></i> ' + selInfusions.length + ' chosen</span>' : ''}
      </h3>
      <p style="font-size:0.82rem;color:var(--text-muted);margin:0 0 var(--spacing-md);">Infusions are magical improvements you can apply to non-magical items. You can choose up to ${knownInfusions} infusions.</p>
      <div class="grid grid-2">
        ${ARTIFICER_INFUSIONS.filter(function(inf){ return (inf.minLevel || 2) <= lvl; }).map(function(inf) {
          const active = selInfusions.some(function(s){ return s.name === inf.name; });
          const border = active ? 'border:2px solid #5b9bd5;box-shadow:0 0 12px rgba(91,155,213,0.25);' : 'border:1px solid var(--border-color);';
          const safeName = inf.name.replace(/'/g, "\\'");
          return '<div class="card card-clickable ' + (active ? 'selected-card' : '') + '" style="' + border + '" onclick="toggleInfusionByName(\'' + safeName + '\', ' + knownInfusions + ')">'

            + (active ? '<i class="fas fa-check" style="color:#5b9bd5;font-size:0.8rem;"></i>' : '')
            + '<h4 style="margin:0;color:#5b9bd5;font-size:0.9rem;">' + inf.name + '</h4>'
            + (inf.minLevel > 2 ? '<span style="font-size:0.7rem;color:var(--text-muted);background:var(--bg-hover);padding:1px 5px;border-radius:10px;">Lvl ' + inf.minLevel + '+</span>' : '')

    </div>` : '';

  return `

             onclick="selectClass('${cls.id}')">
          <h3 style="margin: 0 0 var(--spacing-md); color: var(--accent-green);">${cls.name}</h3>
          <div style="color:var(--text-secondary);margin-bottom:var(--spacing-md);font-size:0.9rem;">

            <p style="margin:var(--spacing-sm) 0;"><strong>Primary Ability:</strong> ${cls.primaryAbility}</p>
            <p style="margin:var(--spacing-sm) 0;"><strong>Spellcaster:</strong> ${cls.spellcaster ? 'Yes' : 'No'}</p>
          </div>

            <p style="margin:0;">${cls.description.substring(0, 80)}...</p>
          </div>
        </div>
      `).join('')}
    </div>
    ${levelPicker}
    ${subclassPicker}
    ${infusionPicker}
  `;
}

function estimateHP(cls, level) {
  if (!cls) return '?';
  const con = AppState.characterBuilder.abilityScores[2] || 10;
  const conMod = Math.floor((con - 10) / 2);
  const hd = cls.hitDice || 8;
  const avgPerLevel = Math.floor(hd / 2) + 1;
  return Math.max(1, (hd + conMod) + (level - 1) * (avgPerLevel + conMod));
}

function setCharLevel(l) {
  AppState.characterBuilder.level = l;
  if (l < 3) AppState.characterBuilder.subclass = null;
  if (l < 2) AppState.characterBuilder.infusions = [];
  renderCharacterBuilder();
}

function selectSubclass(sc) {
  AppState.characterBuilder.subclass = sc;
  renderCharacterBuilder();
}

function toggleInfusion(inf, maxKnown) {
  const list = AppState.characterBuilder.infusions;
  const idx = list.findIndex(s => s.name === inf.name);
  if (idx > -1) {
    list.splice(idx, 1);
  } else {
    if (list.length >= maxKnown) {
      showToast('Maximum aantal infusions bereikt (' + maxKnown + ')', 'warning');
      return;
    }
    list.push(inf);
  }
  renderCharacterBuilder();
}

function renderAbilityScores() {
  const shortNames = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
  // Map short ability name -> index in abilityScores array
  const abilityIndexMap = { STR: 0, DEX: 1, CON: 2, INT: 3, WIS: 4, CHA: 5 };

  function modStr(score) {
    const mod = Math.floor((Number(score) - 10) / 2);
    return (mod >= 0 ? '+' : '') + mod;
  }

  return `
    <div class="form-group" style="margin-bottom: var(--spacing-xl);">
      <label>Methode:</label>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--spacing-md);">
        <button class="btn ${AppState.characterBuilder.abilityMethod === 'standard' ? 'btn-primary' : 'btn-secondary'}"
                onclick="setAbilityMethod('standard')">Standaard Array</button>
        <button class="btn ${AppState.characterBuilder.abilityMethod === 'pointbuy' ? 'btn-primary' : 'btn-secondary'}"
                onclick="setAbilityMethod('pointbuy')">Point Buy</button>
        <button class="btn ${AppState.characterBuilder.abilityMethod === 'manual' ? 'btn-primary' : 'btn-secondary'}"
                onclick="setAbilityMethod('manual')">Manual Entry</button>
      </div>
    </div>

    ${AppState.characterBuilder.abilityMethod === 'pointbuy' ? `
      <div style="background:var(--bg-secondary);border-radius:var(--radius-md);padding:var(--spacing-md);margin-bottom:var(--spacing-lg);color:var(--text-secondary);font-size:0.9rem;">
        <strong>Point Buy:</strong> Je hebt 27 punten te besteden. Scores lopen van 8-15.
        Kosten: 8=0, 9=1, 10=2, 11=3, 12=4, 13=5, 14=7, 15=9.
        Punten over: <span id="pb-remaining">${27 - calcPointBuyCost()}</span>
      </div>` : ''}

    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--spacing-lg); margin-bottom: var(--spacing-xl);">
      ${shortNames.map((name, i) => {
        const score = Number(AppState.characterBuilder.abilityScores[i]) || 8;
        const mod = Math.floor((score - 10) / 2);
        const modDisplay = (mod >= 0 ? '+' : '') + mod;
        return `
          <div style="text-align: center;">
            <div class="stat-box" style="margin-bottom:var(--spacing-sm);">
              <div class="stat-label">${name}</div>
              <div class="stat-value">${score}</div>
              <div class="stat-modifier">${modDisplay}</div>
            </div>
            ${AppState.characterBuilder.abilityMethod === 'manual' ? `
              <input type="number" min="3" max="20" value="${score}"
                     style="width:100%;padding:var(--spacing-sm);background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--radius-md);color:var(--text-primary);text-align:center;"
                     oninput="updateAbilityScore(${i}, this.value)">
            ` : AppState.characterBuilder.abilityMethod === 'pointbuy' ? `
              <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;">
                <button class="btn btn-sm btn-secondary" onclick="pbAdjust(${i}, -1)" ${score <= 8 ? 'disabled' : ''}>-</button>
                <span style="color:var(--text-primary);font-weight:600;">${score}</span>
                <button class="btn btn-sm btn-secondary" onclick="pbAdjust(${i}, 1)" ${score >= 15 ? 'disabled' : ''}>+</button>
              </div>
            ` : `
              <select style="width:100%;padding:var(--spacing-sm);background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--radius-md);color:var(--text-primary);"
                      onchange="updateAbilityScore(${i}, this.value)">
                ${[15,14,13,12,10,8].map(v => `<option value="${v}" ${v === score ? 'selected' : ''}>${v}</option>`).join('')}
              </select>
            `}
          </div>
        `;
      }).join('')}
    </div>

    <div style="background-color: var(--bg-secondary); border-radius: var(--radius-lg); padding: var(--spacing-lg);">
      <h4 style="margin-top: 0; color: var(--text-primary);">Skill Modifiers</h4>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--spacing-md);">
        ${DND_DATA.skills.map(skill => {
          const idx = abilityIndexMap[skill.ability] !== undefined ? abilityIndexMap[skill.ability] : -1;
          const score = idx >= 0 ? Number(AppState.characterBuilder.abilityScores[idx]) || 10 : 10;
          const modifier = Math.floor((score - 10) / 2);
          const modDisplay = (modifier >= 0 ? '+' : '') + modifier;
          return `
            <div style="padding: var(--spacing-md); background-color: var(--bg-card); border-radius: var(--radius-md); display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-weight: 600; color: var(--text-primary); font-size:0.9rem;">${skill.name}</div>
                <div style="font-size: 0.8rem; color: var(--text-muted);">${skill.ability}</div>
              </div>
              <div style="font-size: 1.2rem; color: ${modifier >= 0 ? 'var(--accent-green)' : 'var(--accent-red)'}; font-weight: 700;">${modDisplay}</div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function renderBackgroundAlignment() {

}

function renderSpellSelection() {
  if (!AppState.characterBuilder.class || !AppState.characterBuilder.class.spellcaster) {
    return `
      <div style="text-align: center; padding: var(--spacing-2xl);">
        <p style="color: var(--text-secondary); margin-bottom: var(--spacing-lg);">Your chosen class cannot use spells.</p>
        <p style="color: var(--text-muted);">Continue to the next step.</p>
      </div>
    `;
  }

  // Fix: case-insensitive match op class naam
  const className = AppState.characterBuilder.class.name.toLowerCase();
  const classSpells = DND_DATA.spells.filter(s =>
    Array.isArray(s.classes) && s.classes.some(c => c.toLowerCase() === className)
  );
  const cantrips = classSpells.filter(s => s.level === 0);
  const level1   = classSpells.filter(s => s.level === 1);
  const level2   = classSpells.filter(s => s.level === 2);

  // Bepaal max cantrips op basis van class
  const cantripMax = { wizard: 3, sorcerer: 4, warlock: 2, bard: 2, cleric: 3, druid: 2, ranger: 0, artificer: 2 }[className] || 3;
  const selectedCantrips = AppState.characterBuilder.spells.filter(id => cantrips.some(s => s.id === id));
  const selected1st      = AppState.characterBuilder.spells.filter(id => level1.some(s => s.id === id));

  function spellCard(spell, maxReached) {
    const checked = AppState.characterBuilder.spells.includes(spell.id);
    const disabled = !checked && maxReached;
    return `

// Helper functions for character builder
function selectRace(raceId) {
  AppState.characterBuilder.race = DND_DATA.races.find(r => r.id === raceId);
  renderCharacterBuilder();
}

function selectClass(classId) {
  AppState.characterBuilder.class = DND_DATA.classes.find(c => c.id === classId);
  renderCharacterBuilder();
}

function selectBackground(bgId) {
  AppState.characterBuilder.background = DND_DATA.backgrounds.find(b => b.id === bgId);
  renderCharacterBuilder();
}

function selectAlignment(alignName) {
  AppState.characterBuilder.alignment = alignName;
  renderCharacterBuilder();
}

function setAbilityMethod(method) {
  AppState.characterBuilder.abilityMethod = method;
  if (method === 'pointbuy') {
    AppState.characterBuilder.abilityScores = [8, 8, 8, 8, 8, 8];
  } else if (method === 'standard') {
    AppState.characterBuilder.abilityScores = [15, 14, 13, 12, 10, 8];
  }
  renderCharacterBuilder();
}

function updateAbilityScore(index, value) {
  const v = parseInt(value);
  if (!isNaN(v)) AppState.characterBuilder.abilityScores[index] = Math.min(20, Math.max(3, v));
  renderCharacterBuilder();
}

// Point Buy cost table
const PB_COST = { 8:0, 9:1, 10:2, 11:3, 12:4, 13:5, 14:7, 15:9 };
function calcPointBuyCost() {
  return AppState.characterBuilder.abilityScores.reduce((sum, s) => sum + (PB_COST[s] || 0), 0);
}
function pbAdjust(index, delta) {
  const current = AppState.characterBuilder.abilityScores[index];
  const next = current + delta;
  if (next < 8 || next > 15) return;
  const spent = calcPointBuyCost();
  const currentCost = PB_COST[current] || 0;
  const nextCost = PB_COST[next] || 0;
  const diff = nextCost - currentCost;
  if (spent + diff > 27) { showToast('Niet genoeg punten over!', 'warning'); return; }
  AppState.characterBuilder.abilityScores[index] = next;
  renderCharacterBuilder();
}

function toggleSpellSelection(spellId) {
  const index = AppState.characterBuilder.spells.indexOf(spellId);
  if (index > -1) {
    AppState.characterBuilder.spells.splice(index, 1);
  } else {
    AppState.characterBuilder.spells.push(spellId);
  }
  renderCharacterBuilder();
}

function nextStep() {
  if (AppState.characterBuilder.step < 8) {
    // Validate current step
    if (AppState.characterBuilder.step === 1 && !AppState.characterBuilder.name) {
      showToast('Please enter your character name first', 'error');
      // Focus the name field
      const nameInput = document.getElementById('char-name-step1');
      if (nameInput) { nameInput.focus(); nameInput.style.borderColor = 'var(--accent-red)'; }
      return;
    }
    if (AppState.characterBuilder.step === 1 && !AppState.characterBuilder.race) {
      showToast('Please select a race', 'error');
      return;
    }
    if (AppState.characterBuilder.step === 2 && !AppState.characterBuilder.class) {
      showToast('Please select a class', 'error');
      return;
    }
    // Step 1: background is also required
    if (AppState.characterBuilder.step === 1 && !AppState.characterBuilder.background) {
      showToast('Please also select a background (scroll down)', 'error');
      return;
    }
    // Step 4: alignment required
    if (AppState.characterBuilder.step === 4 && !AppState.characterBuilder.alignment) {
      showToast('Please select your alignment', 'error');
      return;
    }

    AppState.characterBuilder.step++;
    if (AppState.characterBuilder.step > (AppState.characterBuilder.maxStep || 1)) {
      AppState.characterBuilder.maxStep = AppState.characterBuilder.step;
    }
    renderCharacterBuilder();
  }
}

function previousStep() {
  if (AppState.characterBuilder.step > 1) {
    AppState.characterBuilder.step--;
    renderCharacterBuilder();
  }
}

// Jump to any step that has been reached (forward OR back)
function goToStep(targetStep) {
  var maxReached = AppState.characterBuilder.maxStep || AppState.characterBuilder.step;
  if (targetStep >= 1 && targetStep <= maxReached) {
    AppState.characterBuilder.step = targetStep;
    renderCharacterBuilder();
  }
}

function buildCharacterFromWizard() {
  const cb = AppState.characterBuilder;
  const abilities = cb.abilityScores;
  const dex = abilities[1], con = abilities[2], wis = abilities[4];
  const dexMod = Math.floor((dex - 10) / 2);
  const conMod = Math.floor((con - 10) / 2);
  const wisMod = Math.floor((wis - 10) / 2);

  const cls = cb.class;
  const hitDie = cls ? cls.hitDice : 8;
  const level = cb.level || 1;

  // HP
  const avgPerLevel = Math.floor(hitDie / 2) + 1;
  const hp = Math.max(1, (hitDie + conMod) + (level - 1) * (avgPerLevel + conMod));
  const profBonus = Math.ceil(level / 4) + 1;

  // Spell slots and class features
  const spellSlots = getSpellSlotsForLevel(cls ? cls.name : '', level);
  const features = getClassFeaturesForLevel(cls ? cls.name : '', level);

  // AC calculation based on armor type + shield
  const armorId = cb.armorEquipped;
  const hasShield = cb.shieldEquipped || false;
  let baseAC = 10 + dexMod; // Unarmored default
  const clsName = cls ? cls.name : '';
  if (!armorId) {
    if (clsName === 'Barbarian') baseAC = 10 + dexMod + conMod;
    else if (clsName === 'Monk') baseAC = 10 + dexMod + wisMod;
  } else {
    const armorItem = typeof DND_ARMOR !== 'undefined' ? DND_ARMOR.find(function(a) { return a.id === armorId; }) : null;
    if (armorItem) {
      if (armorItem.type === 'light') baseAC = armorItem.ac + dexMod;
      else if (armorItem.type === 'medium') baseAC = armorItem.ac + Math.min(2, dexMod);
      else if (armorItem.type === 'heavy') baseAC = armorItem.ac;
    }
  }
  if (hasShield) baseAC += 2;

  // Skill proficiencies: background (fixed) + class (first 2)
  const CLASS_SKILL_PROF_MAP = {
    'Artificer': ['Investigation','Perception'], 'Barbarian': ['Athletics','Intimidation'],
    'Bard': ['Perception','Performance'], 'Cleric': ['Insight','Religion'],
    'Druid': ['Nature','Survival'], 'Fighter': ['Athletics','Perception'],
    'Monk': ['Acrobatics','Stealth'], 'Paladin': ['Athletics','Persuasion'],
    'Ranger': ['Perception','Survival'], 'Rogue': ['Stealth','Deception'],
    'Sorcerer': ['Arcana','Persuasion'], 'Warlock': ['Arcana','Deception'],
    'Wizard': ['Arcana','History'],
  };
  const bgObj = DND_DATA.backgrounds.find(function(b){ return b.name === (cb.background ? cb.background.name : ''); });
  const bgSkills = bgObj && bgObj.skillProficiencies ? bgObj.skillProficiencies : [];
  const clsSkills = CLASS_SKILL_PROF_MAP[clsName] || [];
  const proficientSkills = [...new Set([...bgSkills, ...clsSkills])];

  return {
    id: generateId(),
    name: cb.name,
    race: cb.race ? cb.race.name : '',
    class: clsName,
    background: cb.background ? cb.background.name : '',
    alignment: cb.alignment,
    level: level,
    subclass: cb.subclass ? cb.subclass.name : null,
    hitDie: hitDie,
    xp: 0,
    ac: baseAC,
    hp: hp,
    maxHp: hp,
    tempHp: 0,
    proficiencyBonus: profBonus,
    abilities: abilities,
    proficientSkills: proficientSkills,
    spells: cb.spells,
    spellSlots: spellSlots,
    portrait: cb.portrait || null,
    infusions: cb.infusions || [],
    armor: armorId || null,
    shieldEquipped: hasShield,
    weapons: cb.weaponsSelected || [],
    startingGold: cb.startingGold || 0,
    skills: [],
    features: features,
    traits: [],
    deathSaves: {successes: 0, failures: 0},
    conditions: [],
    notes: '',
    inspiration: false
  };
}

// Spell slot table for full casters (Bard, Cleric, Druid, Sorcerer, Wizard)
const SPELL_SLOTS_FULL = [
  null,
  [2,0,0,0,0,0,0,0,0],[3,0,0,0,0,0,0,0,0],[4,2,0,0,0,0,0,0,0],[4,3,0,0,0,0,0,0,0],
  [4,3,2,0,0,0,0,0,0],[4,3,3,0,0,0,0,0,0],[4,3,3,1,0,0,0,0,0],[4,3,3,2,0,0,0,0,0],
  [4,3,3,3,1,0,0,0,0],[4,3,3,3,2,0,0,0,0],[4,3,3,3,2,1,0,0,0],[4,3,3,3,2,1,0,0,0],
  [4,3,3,3,2,1,1,0,0],[4,3,3,3,2,1,1,0,0],[4,3,3,3,2,1,1,1,0],[4,3,3,3,2,1,1,1,0],
  [4,3,3,3,2,1,1,1,1],[4,3,3,3,3,1,1,1,1],[4,3,3,3,3,2,1,1,1],[4,3,3,3,3,2,2,1,1],
];

function getSpellSlotsForLevel(className, level) {
  const full = ['Bard','Cleric','Druid','Sorcerer','Wizard'];
  const half = ['Paladin','Ranger'];
  const third = ['Artificer'];
  if (full.includes(className)) return SPELL_SLOTS_FULL[level] || null;
  if (half.includes(className)) { const e = Math.floor(level / 2); return e >= 1 ? SPELL_SLOTS_FULL[e] : null; }
  if (third.includes(className)) { const e = Math.ceil(level / 3); return e >= 1 ? SPELL_SLOTS_FULL[e] : null; }
  if (className === 'Warlock') {
    const slotLvl = Math.min(5, Math.ceil(level / 2));
    const num = level < 2 ? 1 : level < 11 ? 2 : level < 17 ? 3 : 4;
    const s = [0,0,0,0,0,0,0,0,0];
    if (slotLvl >= 1) s[slotLvl - 1] = num;
    return s;
  }
  return null;
}

    'Bard':       {1:'Bardic Inspiration, Spellcasting',2:'Yesck of All Trades, Song of Rest',3:'Subclass, Expertise',4:'ASI',5:'Font of Inspiration',6:'Countercharm',10:'Magical Secrets',20:'Superior Inspiration'},
    'Cleric':     {1:'Spellcasting, Divine Order',2:'Channel Divinity',3:'Subclass',4:'ASI',5:'Smite Undead',6:'Blessed Strikes',7:'Divine Intervention',10:'Divine Intervention verbeterd',20:'Greater Divine Intervention'},
    'Druid':      {1:'Druidic, Primal Order, Spellcasting',2:'Wild Shape, Wild Companion',3:'Subclass',4:'ASI, Wild Shape verbeterd',6:'Subclass Feature',8:'Timeless Body',10:'Subclass Feature',20:'Beast Spells'},
    'Fighter':    {1:'Fighting Style, Second Wind',2:'Action Surge',3:'Subclass',4:'ASI',5:'Extra Attack',6:'ASI',7:'Indomitable',9:'Indomitable (2)',11:'Extra Attack (2)',13:'Indomitable (3)',17:'Action Surge (2)',20:'Extra Attack (3)'},
    'Monk':       {1:'Martial Arts, Unarmored Defense',2:'Ki, Unarmored Movement',3:'Subclass, Deflect Missiles',4:'ASI, Slow Fall',5:'Extra Attack, Stunning Strike',6:'Ki-Empowered Strikes',7:'Evasion, Stillness of Mind',10:'Purity of Body',13:'Tongue of the Sun and Moon',15:'Diamond Soul',18:'Empty Body',20:'Perfect Self'},
    'Paladin':    {1:'Divine Sense, Lay on Hands',2:'Fighting Style, Spellcasting, Divine Smite',3:'Subclass, Divine Health',4:'ASI',5:'Extra Attack',6:'Aura of Protection',8:'ASI',9:'Aura of Courage',11:'Radiant Strikes',14:'Restoring Touch',19:'Aura Expansion',20:'Subclass Feature'},
    'Ranger':     {1:'Favored Enemy, Spellcasting',2:'Fighting Style',3:'Subclass',4:'ASI',5:'Extra Attack',6:'Roving',8:'ASI',10:'Tireless',14:'Subclass Feature',18:'Feral Senses',20:'Foe Slayer'},
    'Rogue':      {1:'Expertise, Sneak Attack, Thieves Cant',2:'Cunning Action',3:'Subclass, Steady Aim',4:'ASI',5:'Uncanny Dodge',6:'Expertise (2)',7:'Evasion',8:'ASI',11:'Reliable Languagest',14:'Blindsense',15:'Slippery Mind',18:'Elusive',20:'Stroke of Luck'},
    'Sorcerer':   {1:'Innate Sorcery, Spellcasting',2:'Font of Magic, Metamagic',3:'Subclass',4:'ASI',5:'Sorcerous Restoration',6:'Subclass Feature',8:'ASI',10:'Metamagic verbeterd',12:'ASI',14:'Subclass Feature',16:'ASI',19:'ASI',20:'Arcane Apotheosis'},
    'Warlock':    {1:'Eldritch Invocations, Pact Magic',2:'Magical Cunning',3:'Subclass',4:'ASI',5:'Contact Patron',6:'Subclass Feature',7:'ASI',11:'Mystic Arcanum (6)',13:'Mystic Arcanum (7)',15:'Mystic Arcanum (8)',17:'Mystic Arcanum (9)',19:'ASI',20:'Eldritch Master'},
    'Wizard':     {1:'Arcane Recovery, Spellcasting',2:'Scholar',3:'Subclass',4:'ASI',5:'Memorize Spell',6:'Subclass Feature',8:'ASI',10:'Subclass Feature',12:'ASI',14:'Subclass Feature',16:'ASI',18:'Spell Mastery',19:'ASI',20:'Signature Spells'},
  };
  const cf = all[className] || {};
  return Object.entries(cf).filter(([l]) => parseInt(l) <= level).map(([l, f]) => '<strong>Lvl ' + l + ':</strong> ' + f);
}

function finishCharacter() {
  if (!AppState.characterBuilder.name) {
    showToast('Please enter a character name', 'error');
    return;
  }

  var character;
  try {
    character = buildCharacterFromWizard();
  } catch (err) {
    console.error('buildCharacterFromWizard error:', err);
    showToast('Error creating character: ' + err.message, 'error');
    return;
  }
  AppState.characters.push(character);
  saveState();
  
  // Reset builder
  AppState.characterBuilder = {
    step: 1,
    race: null,
    class: null,
    abilityScores: [15, 14, 13, 12, 10, 8],
    abilityMethod: 'standard',
    background: null,
    alignment: null,
    name: '',
    spells: [],
    portrait: null,
    raceSearch: '',
    backgroundSearch: '',
    level: 1,
    subclass: null,
    infusions: [],
    armorEquipped: null,
    shieldEquipped: false,
    weaponsSelected: [],
    startingGold: 0
  };

  selectCharacter(character.id);
  showToast(`Character ${character.name} created!`, 'success');
  navigateTo('character-sheet');
}

const CLASS_WEAPON_MARTIAL = ['Barbarian','Fighter','Paladin','Ranger'];

const CLASS_STARTING_GOLD = {
  'Artificer': {avg:125, formula:'5d4×10'},
  'Barbarian': {avg:50,  formula:'2d4×10'},
  'Bard':      {avg:125, formula:'5d4×10'},
  'Cleric':    {avg:125, formula:'5d4×10'},
  'Druid':     {avg:50,  formula:'2d4×10'},
  'Fighter':   {avg:125, formula:'5d4×10'},

  'Paladin':   {avg:125, formula:'5d4×10'},
  'Ranger':    {avg:125, formula:'5d4×10'},
  'Rogue':     {avg:100, formula:'4d4×10'},
  'Sorcerer':  {avg:75,  formula:'3d4×10'},
  'Warlock':   {avg:100, formula:'4d4×10'},
  'Wizard':    {avg:100, formula:'4d4×10'},
};

function rollStartingGold(className) {
  var g = CLASS_STARTING_GOLD[className];
  if (!g) { AppState.characterBuilder.startingGold = 10; renderCharacterBuilder(); return; }
  // Roll dice based on formula
  function d4() { return Math.floor(Math.random() * 4) + 1; }
  var result = 0;
  if (className === 'Monk') {
    for (var i = 0; i < 5; i++) result += d4();
  } else {
    var rolls = className === 'Sorcerer' ? 3 : className === 'Rogue' || className === 'Warlock' || className === 'Wizard' ? 4 : 5;
    for (var i = 0; i < rolls; i++) result += d4();
    result *= 10;
  }
  AppState.characterBuilder.startingGold = result;
  renderCharacterBuilder();
}

function setEquipmentGold(val) {
  var n = parseInt(val, 10);
  AppState.characterBuilder.startingGold = isNaN(n) ? 0 : Math.max(0, n);
  saveState();
}

function toggleWeapon(weaponId) {
  if (!Array.isArray(AppState.characterBuilder.weaponsSelected)) AppState.characterBuilder.weaponsSelected = [];
  var list = AppState.characterBuilder.weaponsSelected;
  var idx = list.indexOf(weaponId);
  if (idx > -1) {
    list.splice(idx, 1);
  } else {
    list.push(weaponId);
  }
  renderCharacterBuilder();
}

function selectArmor(armorId) {
  if (armorId === 'shield') {
    AppState.characterBuilder.shieldEquipped = !AppState.characterBuilder.shieldEquipped;
  } else {
    AppState.characterBuilder.armorEquipped = armorId;
  }
  renderCharacterBuilder();
}

function renderEquipmentStep() {
  var cls = AppState.characterBuilder.class;
  var clsName = cls ? cls.name : '';
  var selArmor = AppState.characterBuilder.armorEquipped;
  var selShield = AppState.characterBuilder.shieldEquipped || false;
  var selWeapons = AppState.characterBuilder.weaponsSelected || [];
  var gold = AppState.characterBuilder.startingGold || 0;
  var goldInfo = CLASS_STARTING_GOLD[clsName] || {avg: 10, formula: '?'};

  var armorProfs = CLASS_ARMOR_PROF[clsName] || [];
  var hasMartial = CLASS_WEAPON_MARTIAL.includes(clsName) ||
    ['Bard','Rogue'].includes(clsName); // Bard/Rogue get some martial

  // Filter armor by proficiency
  var availArmor = DND_ARMOR.filter(function(a) {
    return armorProfs.includes(a.type);
  });

  // Filter weapons by proficiency (types are 'simple melee', 'simple ranged', 'martial melee', 'martial ranged')
  var availWeapons = DND_WEAPONS.filter(function(w) {
    if ((w.type || '').includes('simple')) return true;
    if ((w.type || '').includes('martial') && hasMartial) return true;
    return false;
  });

  // Armor type labels
  var typeLabel = { light: 'Light Armor', medium: 'Medium Armor', heavy: 'Heavy Armor', shield: 'Shield' };

  // Build armor HTML grouped by type
  var armorByType = {};
  availArmor.forEach(function(a) {
    if (!armorByType[a.type]) armorByType[a.type] = [];
    armorByType[a.type].push(a);
  });

  var armorHtml = '';
  if (availArmor.length === 0) {
    armorHtml = '<p style="color:var(--text-muted);font-size:0.9rem;">Your class has no armor proficiency. You rely on other defenses.</p>';
  } else {
    ['light','medium','heavy','shield'].forEach(function(t) {
      if (!armorByType[t]) return;
      armorHtml += '<h4 style="margin:var(--spacing-md) 0 var(--spacing-sm);color:var(--text-secondary);font-size:0.85rem;text-transform:uppercase;letter-spacing:0.05em;">' + (typeLabel[t] || t) + '</h4>';
      armorHtml += '<div class="grid grid-3" style="margin-bottom:var(--spacing-sm);">';
      armorByType[t].forEach(function(a) {
        var isShield = a.type === 'shield';
        var active = isShield ? selShield : (selArmor === a.id);
        var border = active ? 'border:2px solid var(--accent-green);box-shadow:0 0 12px rgba(0,184,148,0.25);background:rgba(0,184,148,0.05);' : 'border:1px solid var(--border-color);';
        armorHtml += '<div class="card card-clickable" style="' + border + 'padding:var(--spacing-md);cursor:pointer;" onclick="selectArmor(' + "'" + a.id + "'" + ')">'
          + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">'
          + '<h4 style="margin:0;font-size:0.85rem;color:' + (active ? 'var(--accent-green)' : 'var(--text-primary)') + ';">'
          + (active ? '<i class="fas fa-check" style="margin-right:5px;"></i>' : '') + a.name + '</h4>'
          + '<span style="font-size:0.8rem;font-weight:700;color:var(--accent-gold);">AC +' + a.ac + '</span>'
          + '</div>'
          + (isShield ? '<p style="margin:0;font-size:0.72rem;color:var(--text-muted);">Can be combined with armor</p>' : '')
          + (a.note ? '<p style="margin:0;font-size:0.72rem;color:var(--accent-red);">' + a.note + '</p>' : '')
          + '</div>';
      });
      armorHtml += '</div>';
    });
    // Deselect option
    if (selArmor) {
      armorHtml += '<button class="btn btn-secondary" style="margin-top:var(--spacing-sm);font-size:0.8rem;" onclick="selectArmor(null)">No armor</button>';
    }
  }

  // Build weapons HTML
  var weaponHtml = '<div class="grid grid-3">';
  availWeapons.forEach(function(w) {
    var active = selWeapons.indexOf(w.id) > -1;
    var border = active ? 'border:2px solid #5b9bd5;box-shadow:0 0 10px rgba(91,155,213,0.2);background:rgba(91,155,213,0.05);' : 'border:1px solid var(--border-color);';
    var isMartial = (w.type || '').includes('martial');
    weaponHtml += '<div class="card card-clickable" style="' + border + 'padding:var(--spacing-md);cursor:pointer;" onclick="toggleWeapon(' + "'" + w.id + "'" + ')">'
      + '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">'
      + '<h4 style="margin:0;font-size:0.85rem;color:' + (active ? '#5b9bd5' : 'var(--text-primary)') + ';">'
      + (active ? '<i class="fas fa-check" style="margin-right:5px;"></i>' : '') + w.name + '</h4>'
      + '<span style="font-size:0.7rem;background:' + (isMartial ? 'rgba(220,53,69,0.15)' : 'rgba(0,184,148,0.15)') + ';color:' + (isMartial ? 'var(--accent-red)' : 'var(--accent-green)') + ';padding:1px 6px;border-radius:10px;white-space:nowrap;">' + (isMartial ? 'Martial' : 'Simple') + '</span>'
      + '</div>'
      + '<p style="margin:0;font-size:0.75rem;color:var(--accent-gold);">' + w.damage + '</p>'
      + '<p style="margin:2px 0 0;font-size:0.72rem;color:var(--text-muted);">' + w.props + '</p>'
      + '</div>';
  });
  weaponHtml += '</div>';

  return `
    <div>
      <!-- Armor section -->
      <div style="background:var(--bg-secondary);border-radius:var(--radius-lg);padding:var(--spacing-lg);margin-bottom:var(--spacing-xl);border:1px solid var(--border-color);">
        <h3 style="margin:0 0 var(--spacing-md);color:var(--text-primary);">
          <i class="fas fa-shield-alt" style="color:var(--accent-gold);margin-right:8px;"></i>Armor
          ${selArmor || selShield ? '<span style="color:var(--accent-green);font-size:0.85rem;margin-left:8px;"><i class="fas fa-check"></i> ' + (selArmor ? (DND_ARMOR.find(a => a.id === selArmor) || {name:''}).name : '') + (selShield ? (selArmor ? ' + Shield' : 'Shield') : '') + '</span>' : '<span style="font-size:0.8rem;color:var(--text-muted);margin-left:8px;">(optional)</span>'}
        </h3>
        ${armorHtml}
      </div>

      <!-- Weapons section -->
      <div style="background:var(--bg-secondary);border-radius:var(--radius-lg);padding:var(--spacing-lg);margin-bottom:var(--spacing-xl);border:1px solid var(--border-color);">
        <h3 style="margin:0 0 var(--spacing-md);color:var(--text-primary);">
          <i class="fas fa-sword" style="color:var(--accent-red);margin-right:8px;"></i>Weapons
          ${selWeapons.length > 0 ? '<span style="color:#5b9bd5;font-size:0.85rem;margin-left:8px;"><i class="fas fa-check"></i> ' + selWeapons.length + ' selected</span>' : '<span style="font-size:0.8rem;color:var(--text-muted);margin-left:8px;">(optional)</span>'}
        </h3>
        <p style="font-size:0.82rem;color:var(--text-muted);margin:0 0 var(--spacing-md);">Choose the weapons your character carries. You can select multiple weapons.</p>
        ${weaponHtml}
      </div>

      <!-- Starting gold section -->
      <div style="background:var(--bg-secondary);border-radius:var(--radius-lg);padding:var(--spacing-lg);border:1px solid var(--border-color);">
        <h3 style="margin:0 0 var(--spacing-md);color:var(--text-primary);">
          <i class="fas fa-coins" style="color:var(--accent-gold);margin-right:8px;"></i>Starting Gold
          <span style="font-size:0.8rem;font-weight:400;color:var(--text-muted);margin-left:8px;">${goldInfo.formula} (avg. ${goldInfo.avg} gp)</span>
        </h3>
        <div style="display:flex;align-items:center;gap:var(--spacing-md);flex-wrap:wrap;">
          <div style="display:flex;align-items:center;gap:8px;">
            <input type="number" min="0" max="9999" value="${gold}"
              onchange="setEquipmentGold(this.value)"
              style="width:90px;padding:8px 10px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-card);color:var(--text-primary);font-size:1rem;">
            <span style="color:var(--accent-gold);font-weight:600;">GP</span>
          </div>
          <button class="btn btn-secondary" style="display:flex;align-items:center;gap:6px;" onclick="rollStartingGold('${clsName}')">
            <i class="fas fa-dice"></i> Roll (${goldInfo.formula})
          </button>
          <button class="btn btn-secondary" style="font-size:0.85rem;" onclick="AppState.characterBuilder.startingGold=${goldInfo.avg};renderCharacterBuilder();">
            Average (${goldInfo.avg} GP)
          </button>
        </div>
        ${gold > 0 ? '<p style="margin:var(--spacing-sm) 0 0;font-size:0.85rem;color:var(--accent-green);">You start with <strong>' + gold + ' GP</strong>.</p>' : ''}
      </div>
    </div>
  `;
}

function renderPortraitStep() {

function handlePortraitUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  if (!file.type.startsWith('image/')) {
    showToast('Please select an image file (JPG, PNG, etc.)', 'error');
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    showToast('Image is too large (max 5MB)', 'error');
    return;
  }
  
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var MAX = 320;
      var w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
        else        { w = Math.round(w * MAX / h); h = MAX; }
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      AppState.characterBuilder.portrait = canvas.toDataURL('image/jpeg', 0.78);
      renderCharacterBuilder();
      showToast('Portrait loaded!', 'success');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ============================================================================
// XP THRESHOLDS (D&D 2024)
// ============================================================================
const XP_THRESHOLDS = [0,300,900,2700,6500,14000,23000,34000,48000,64000,85000,100000,120000,140000,165000,195000,225000,265000,305000,355000];

function xpForLevel(lvl) { return XP_THRESHOLDS[lvl - 1] || 0; }
function xpForNextLevel(lvl) { return XP_THRESHOLDS[lvl] || null; }

// ── Ensure all chars have the new fields ────────────────────────────────────
function ensureCharFields(char) {
  if (!char.usedSpellSlots) char.usedSpellSlots = [];
  if (char.spellSlots && char.usedSpellSlots.length < char.spellSlots.length) {
    while (char.usedSpellSlots.length < char.spellSlots.length) char.usedSpellSlots.push(0);
  }
  if (char.usedHitDice === undefined) char.usedHitDice = 0;
  if (!char.currency) {
    char.currency = { cp: 0, sp: 0, ep: 0, gp: char.startingGold || 0, pp: 0 };
  }
  if (!char.conditions) char.conditions = [];
  if (char.exhaustion === undefined) char.exhaustion = 0;
  if (char.concentration === undefined) char.concentration = null;
  return char;
}

// ── Spell Slots ──────────────────────────────────────────────────────────────
function useSpellSlot(charId, levelIdx) {
  var char = AppState.characters.find(function(c){return c.id===charId;});
  if (!char) return;
  ensureCharFields(char);
  var maxSlots = Array.isArray(char.spellSlots) ? char.spellSlots[levelIdx] : 0;
  var used = char.usedSpellSlots[levelIdx] || 0;
  if (used >= maxSlots) { showToast('No spell slots remaining at this level!', 'error'); return; }
  char.usedSpellSlots[levelIdx] = used + 1;
  saveState(); renderCharacterSheet();
}

function recoverSpellSlot(charId, levelIdx) {
  var char = AppState.characters.find(function(c){return c.id===charId;});
  if (!char) return;
  ensureCharFields(char);
  var used = char.usedSpellSlots[levelIdx] || 0;
  if (used <= 0) return;
  char.usedSpellSlots[levelIdx] = used - 1;
  saveState(); renderCharacterSheet();
}

// ── Hit Dice ─────────────────────────────────────────────────────────────────
function useHitDie(charId) {
  var char = AppState.characters.find(function(c){return c.id===charId;});
  if (!char) return;
  ensureCharFields(char);
  var maxHD = char.level || 1;
  var used = char.usedHitDice || 0;
  if (used >= maxHD) { showToast('No hit dice remaining!', 'error'); return; }
  var die = char.hitDie || 8;
  var conMod = Math.floor(((char.abilities ? char.abilities[2] : 10) - 10) / 2);
  var roll = Math.floor(Math.random() * die) + 1;
  var heal = Math.max(1, roll + conMod);
  char.usedHitDice = used + 1;
  char.hp = Math.min(char.maxHp, (char.hp || 0) + heal);
  saveState(); renderCharacterSheet();
  showToast('Hit die: rolled ' + roll + ' + CON(' + (conMod>=0?'+':'')+conMod + ') = healed ' + heal + ' HP!', 'success');
}

// ── Short Rest ───────────────────────────────────────────────────────────────
function shortRest(charId) {
  var char = AppState.characters.find(function(c){return c.id===charId;});
  if (!char) return;
  ensureCharFields(char);
  // Warlock recovers all spell slots on short rest
  if (char.class === 'Warlock' && Array.isArray(char.spellSlots)) {
    char.usedSpellSlots = char.spellSlots.map(function(){return 0;});
    showToast('Short rest: Warlock spell slots recovered! Use Hit Dice to heal HP.', 'info');
  } else {
    showToast('Short rest: Use your Hit Dice (▲ button) to heal HP.', 'info');
  }
  saveState(); renderCharacterSheet();
}

// ── Long Rest ────────────────────────────────────────────────────────────────
function longRest(charId) {
  var char = AppState.characters.find(function(c){return c.id===charId;});
  if (!char) return;
  ensureCharFields(char);
  // Full HP
  char.hp = char.maxHp;
  // All spell slots
  if (Array.isArray(char.spellSlots)) {
    char.usedSpellSlots = char.spellSlots.map(function(){return 0;});
  }
  // Recover half hit dice (min 1)
  var maxHD = char.level || 1;
  var regain = Math.max(1, Math.floor(maxHD / 2));
  char.usedHitDice = Math.max(0, (char.usedHitDice || 0) - regain);
  // Reset death saves
  char.deathSaves = {successes:0, failures:0};
  // Clear concentration
  char.concentration = null;
  // Reduce exhaustion by 1
  if (char.exhaustion > 0) char.exhaustion--;
  // Clear short-duration conditions
  var clearOnRest = ['Blinded','Charmed','Deafened','Frightened','Grappled','Incapacitated','Paralyzed','Prone','Restrained','Stunned','Unconscious'];
  char.conditions = (char.conditions||[]).filter(function(c){ return !clearOnRest.includes(c); });
  // Companions full heal
  if (char.companions) {
    Object.keys(char.companions).forEach(function(cid) {
      var cs = char.companions[cid];
      if (cs.maxHp) cs.currentHp = cs.maxHp;
    });
  }
  saveState(); renderCharacterSheet();
  showToast('Long rest complete! HP restored, spell slots recovered, half hit dice regained.', 'success');
}

// ── Currency ─────────────────────────────────────────────────────────────────
function updateCurrency(charId, type, val) {
  var char = AppState.characters.find(function(c){return c.id===charId;});
  if (!char) return;
  ensureCharFields(char);
  char.currency[type] = Math.max(0, parseInt(val)||0);
  saveState();
}

// ── Conditions ───────────────────────────────────────────────────────────────
function toggleCondition(charId, condition) {
  var char = AppState.characters.find(function(c){return c.id===charId;});
  if (!char) return;
  ensureCharFields(char);
  var idx = char.conditions.indexOf(condition);
  if (idx > -1) char.conditions.splice(idx, 1);
  else char.conditions.push(condition);
  saveState(); renderCharacterSheet();
}

// ── Exhaustion ───────────────────────────────────────────────────────────────
function setExhaustion(charId, level) {
  var char = AppState.characters.find(function(c){return c.id===charId;});
  if (!char) return;
  char.exhaustion = level;
  saveState(); renderCharacterSheet();
}

// ── Concentration ────────────────────────────────────────────────────────────
function setConcentration(charId, spellId) {
  var char = AppState.characters.find(function(c){return c.id===charId;});
  if (!char) return;
  char.concentration = (char.concentration === spellId) ? null : spellId;
  saveState(); renderCharacterSheet();
}

// ── XP ───────────────────────────────────────────────────────────────────────
function updateXp(charId, val) {
  var char = AppState.characters.find(function(c){return c.id===charId;});
  if (!char) return;
  var newXp = Math.max(0, parseInt(val)||0);
  char.xp = newXp;
  saveState();
  // Check if enough for next level
  var nextXp = xpForNextLevel(char.level);
  if (nextXp && newXp >= nextXp && char.level < 20) {
    showToast('Enough XP to level up! Hit the Level Up button!', 'success');
  }
}

// ── Level Up ─────────────────────────────────────────────────────────────────
var _levelUpState = {};

function levelUp(charId) {
  var char = AppState.characters.find(function(c){return c.id===charId;});
  if (!char || char.level >= 20) return;
  var newLevel = char.level + 1;
  var die = char.hitDie || 8;
  var conMod = Math.floor(((char.abilities ? char.abilities[2] : 10) - 10) / 2);
  var avgHp = Math.floor(die / 2) + 1 + conMod;
  var asiLevels = [4,8,12,16,19];
  var isAsiLevel = asiLevels.includes(newLevel);
  var abilNames = ['Strength','Dexterity','Constitution','Intelligence','Wisdom','Charisma'];

  _levelUpState = { charId: charId, newLevel: newLevel, hpChoice: 'avg', asiChoice: null, asiTarget: null };

  var asiHtml = '';
  if (isAsiLevel) {
    asiHtml = '<div class="cs-levelup-section"><h4>⬆ Ability Score Improvement (choose one ability +2, or two +1)</h4>'
      + '<div class="cs-asi-grid">'
      + abilNames.map(function(n,i){
          return '<div class="cs-asi-option" onclick="selectAsi('+i+',\'single\')" id="asi-opt-'+i+'">'
            + n + '<br><span style="color:var(--text-muted);font-size:0.7rem;">'+char.abilities[i]+' → <strong style=\'color:#8B0000\'>'+(char.abilities[i]+2)+'</strong></span>'
            + '</div>';
        }).join('')
      + '</div>'
      + '<div style="margin-top:8px;font-size:0.75rem;color:var(--text-muted);">Or split +1 to two abilities (click two, then apply)</div>'
      + '</div>';
  }

  var newFeatures = getClassFeaturesForLevel(char.class, newLevel);

  var html = '<div class="cs-levelup-modal-backdrop" id="levelup-backdrop" onclick="if(event.target===this)closeLevelUp()">'
    + '<div class="cs-levelup-modal">'
    + '<h2>⬆ Level Up! ' + char.name + '</h2>'
    + '<div style="text-align:center;font-size:1.5rem;margin-bottom:16px;">'
    + 'Level <strong style="color:var(--text-muted)">' + char.level + '</strong>'
    + ' → Level <strong style="color:#8B0000">' + newLevel + '</strong></div>'

    + '<div class="cs-levelup-section"><h4>❤️ Hit Point Increase (d' + die + ' + CON ' + (conMod>=0?'+':'') + conMod + ')</h4>'
    + '<div style="display:flex;gap:8px;">'
    + '<div class="cs-asi-option selected" id="hp-avg" onclick="selectHpChoice(\'avg\')">'
    + 'Take Average<br><strong style="color:#8B0000">+' + Math.max(1,avgHp) + ' HP</strong></div>'
    + '<div class="cs-asi-option" id="hp-roll" onclick="rollHpChoice()">'
    + 'Roll Hit Die<br><span style="color:var(--text-muted);" id="hp-roll-val">Roll d' + die + '</span></div>'
    + '</div></div>'

    + asiHtml

    + (newFeatures.length ? '<div class="cs-levelup-section"><h4>✨ New Class Features</h4>'
      + newFeatures.map(function(f){ return '<div style="font-size:0.78rem;color:var(--text-secondary);padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.05);">▸ ' + f + '</div>'; }).join('')
      + '</div>' : '')

    + '<div style="display:flex;gap:8px;margin-top:16px;">'
    + '<button class="btn btn-primary" onclick="confirmLevelUp()">✓ Confirm Level Up</button>'
    + '<button class="btn btn-secondary" onclick="closeLevelUp()">Cancel</button>'
    + '</div>'
    + '</div></div>';

  var el = document.createElement('div');
  el.id = 'levelup-wrap';
  el.innerHTML = html;
  document.body.appendChild(el);
}

function selectHpChoice(choice) {
  _levelUpState.hpChoice = choice;
  _levelUpState.hpRolled = null;
  var avg = document.getElementById('hp-avg');
  var roll = document.getElementById('hp-roll');
  if (avg) avg.classList.toggle('selected', choice === 'avg');
  if (roll) roll.classList.toggle('selected', choice === 'roll');
}

function rollHpChoice() {
  var char = AppState.characters.find(function(c){return c.id===_levelUpState.charId;});
  if (!char) return;
  var die = char.hitDie || 8;
  var conMod = Math.floor(((char.abilities ? char.abilities[2] : 10) - 10) / 2);
  var roll = Math.floor(Math.random() * die) + 1;
  var total = Math.max(1, roll + conMod);
  _levelUpState.hpChoice = 'roll';
  _levelUpState.hpRolled = total;
  var el = document.getElementById('hp-roll-val');
  if (el) el.innerHTML = '<strong style="color:#8B0000">Rolled ' + roll + ' + CON = +' + total + ' HP</strong>';
  document.getElementById('hp-avg')?.classList.remove('selected');
  document.getElementById('hp-roll')?.classList.add('selected');
}

function selectAsi(abilIdx, mode) {
  _levelUpState.asiTarget = abilIdx;
  _levelUpState.asiMode = mode;
  document.querySelectorAll('.cs-asi-option[id^="asi-opt"]').forEach(function(el){ el.classList.remove('selected'); });
  var sel = document.getElementById('asi-opt-' + abilIdx);
  if (sel) sel.classList.add('selected');
}

function confirmLevelUp() {
  var char = AppState.characters.find(function(c){return c.id===_levelUpState.charId;});
  if (!char) return;
  var newLevel = _levelUpState.newLevel;
  var die = char.hitDie || 8;
  var conMod = Math.floor(((char.abilities ? char.abilities[2] : 10) - 10) / 2);
  var avgHp = Math.max(1, Math.floor(die/2)+1+conMod);

  // Apply HP
  var hpGain = (_levelUpState.hpChoice === 'roll' && _levelUpState.hpRolled)
    ? _levelUpState.hpRolled : avgHp;
  char.maxHp += hpGain;
  char.hp    += hpGain;

  // Apply ASI
  var asiLevels = [4,8,12,16,19];
  if (asiLevels.includes(newLevel) && _levelUpState.asiTarget !== null) {
    char.abilities[_levelUpState.asiTarget] = Math.min(20, char.abilities[_levelUpState.asiTarget] + 2);
  }

  // Level up
  char.level = newLevel;

  // Update proficiency bonus
  char.proficiencyBonus = newLevel < 5 ? 2 : newLevel < 9 ? 3 : newLevel < 13 ? 4 : newLevel < 17 ? 5 : 6;

  // Update AC if unarmored (uses Dex or Con)
  // (keep existing AC — user can adjust)

  // Update spell slots
  var newSlots = getSpellSlotsForClass(char.class, newLevel);
  if (newSlots) {
    char.spellSlots = newSlots;
    char.usedSpellSlots = newSlots.map(function(){return 0;});
  }

  // Append new features
  var newFeatures = getClassFeaturesForLevel(char.class, newLevel);
  if (newFeatures.length) {
    var existing = Array.isArray(char.features) ? char.features : [];
    char.features = existing.concat(newFeatures);
  }

  // Recover a new hit die
  char.usedHitDice = Math.max(0, (char.usedHitDice||0) - 1);

  saveState();
  closeLevelUp();
  renderCharacterSheet();
  showToast(char.name + ' is now level ' + newLevel + '! +' + hpGain + ' max HP.', 'success');
}

function closeLevelUp() {
  var el = document.getElementById('levelup-wrap');
  if (el) el.remove();
}

function getSpellSlotsForClass(cls, level) {
  var fullCasters = ['Bard','Cleric','Druid','Sorcerer','Wizard'];
  var halfCasters = ['Paladin','Ranger','Artificer'];
  var thirdCasters = ['Arcane Trickster','Eldritch Knight'];
  if (fullCasters.includes(cls) && typeof SPELL_SLOTS_FULL !== 'undefined') {
    return SPELL_SLOTS_FULL[level] || null;
  }
  if (halfCasters.includes(cls) && typeof SPELL_SLOTS_HALF !== 'undefined') {
    return SPELL_SLOTS_HALF[level] || null;
  }
  if (cls === 'Warlock' && typeof SPELL_SLOTS_WARLOCK !== 'undefined') {
    return SPELL_SLOTS_WARLOCK[level] || null;
  }
  return null;
}

// ── Determine which companions this character has ───────────────────────────
function getCharacterCompanions(char) {
  const companions = [];
  const cls   = (char.class   || '').trim();
  const sub   = (char.subclass|| '').trim();
  const level = char.level || 1;

  for (const key in COMPANION_DEFS) {
    const def = COMPANION_DEFS[key];
    if (def.requiresClass && def.requiresClass !== cls) continue;
    if (def.requiresSubclass && def.requiresSubclass !== sub) continue;
    if (def.requiresLevel && level < def.requiresLevel) continue;
    companions.push(def);
  }
  return companions;
}

// ── Render companion tab HTML ───────────────────────────────────────────────
function renderCompanionTab(char) {
  const defs = getCharacterCompanions(char);

  if (defs.length === 0) {
    return `<div class="no-companion-msg">
      <div class="no-companion-icon">🐾</div>
      <p><strong>No Companions Available</strong></p>
      <p style="font-size:0.85rem;">Companions are unlocked by specific class/subclass combinations:<br>
        <em>Artillerist Artificer (lvl 3)</em> → Eldritch Cannon<br>
        <em>Battle Smith Artificer (lvl 3)</em> → Steel Defender<br>
        <em>Beast Master Ranger (lvl 3)</em> → Primal Companion<br>
        <em>Warlock with Pact of the Chain (lvl 3)</em> → Pact Familiar
      </p>
    </div>`;
  }

  // Ensure companions array exists on char
  if (!char.companions) char.companions = {};

  let html = '';
  for (const def of defs) {
    const state = char.companions[def.id] || {};
    const maxHp = def.getMaxHp ? def.getMaxHp(char) : 20;
    if (state.maxHp !== maxHp) state.maxHp = maxHp;
    if (state.currentHp === undefined) state.currentHp = maxHp;
    char.companions[def.id] = state;

    const curHp   = state.currentHp;
    const isDead  = curHp <= 0;
    const hpPct   = Math.max(0, Math.min(100, (curHp / maxHp) * 100));
    const hpColor = hpPct > 60 ? '#2ecc71' : hpPct > 25 ? '#f39c12' : '#e74c3c';

    const ac      = def.getAc    ? def.getAc(char) : (def.ac || '—');
    const abilities = def.getAbilities ? def.getAbilities(char) : (def.abilities || [10,10,10,10,10,10]);
    const abilNames = ['STR','DEX','CON','INT','WIS','CHA'];
    function modS(v){ const m=Math.floor((v-10)/2); return (m>=0?'+':'')+m; }

    const pb = char.proficiencyBonus || 2;

    // Cannon type selector for Eldritch Cannon

    if (def.id === 'eldritch_cannon') {
      const selType = state.cannonType || 'force_ballista';
      extraHtml += `<div class="companion-section">
        <div class="companion-section-title">⚙️ Cannon Type</div>
        <div class="cannon-options">

            <div class="cannon-option ${ct.id === selType ? 'selected' : ''}"

          ${def.cannonTypes.find(c=>c.id===selType)?.description || ''}
        </div>
        <div style="margin-top:6px;font-size:0.75rem;color:var(--text-muted);font-style:italic;">${def.activateNote}</div>
      </div>`;
      if (def.traits && def.traits.length) {
        extraHtml += `<div class="companion-section">
          <div class="companion-section-title">✨ Traits</div>
          ${def.traits.map(t=>`<div class="companion-action"><strong>${t.name}:</strong> ${t.desc}</div>`).join('')}
        </div>`;
      }
    } else {
      // Traits
      if (def.traits && def.traits.length) {
        extraHtml += `<div class="companion-section">
          <div class="companion-section-title">✨ Traits</div>
          ${def.traits.map(t=>`<div class="companion-action"><strong>${t.name}:</strong> ${t.desc}</div>`).join('')}
        </div>`;
      }
      // Actions
      if (def.actions && def.actions.length) {
        extraHtml += `<div class="companion-section">
          <div class="companion-section-title">⚔️ Actions</div>
          ${def.actions.map(a=>`<div class="companion-action">
            <strong>${a.name}</strong>
            <span style="font-size:0.7rem;background:rgba(139,0,0,0.2);padding:1px 5px;border-radius:3px;margin-left:4px;">${a.type}</span><br>
            <span style="margin-left:4px;">${a.desc
              .replace(/PB/g, '<span style="color:#3498db">'+pb+'</span>')
              .replace(/Int/g, '<span style="color:#f39c12">Int</span>')
            }</span>
          </div>`).join('')}
        </div>`;
      }

    html += `

            <div class="companion-hp-bar-fill" style="width:${hpPct}%;background:${hpColor};"></div>

        </div>

        ${isDead ? `

          </div>

            </button>

            <button class="btn btn-sm" style="background:#27ae60;color:#fff;border:none;"
                    onclick="companionHeal('${char.id}','${def.id}',document.getElementById('chp-${def.id}').value)">
              <i class="fas fa-heart"></i> Heal
            </button>
            <button class="btn btn-sm" style="background:rgba(139,0,0,0.3);color:#fff;border:1px solid #8B0000;"
