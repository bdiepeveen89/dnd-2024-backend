        `}
      </div>
    </div>`;
  }
  return html;
}

// ── Companion interaction functions ─────────────────────────────────────────
function getCharById(id) {
  return AppState.characters.find(c => c.id === id);
}

function companionDamage(charId, companionId, amount) {
  const char = getCharById(charId);
  if (!char || !char.companions) return;
  const amt = parseInt(amount) || 0;
  if (amt <= 0) return;
  const state = char.companions[companionId] || {};
  state.currentHp = Math.max(0, (state.currentHp || 0) - amt);
  char.companions[companionId] = state;
  saveState();
  renderCharacterSheet();
  showToast(`${COMPANION_DEFS[companionId]?.name || 'Companion'} took ${amt} damage (${state.currentHp} HP remaining)`, state.currentHp <= 0 ? 'error' : 'warning');
}

function companionHeal(charId, companionId, amount) {
  const char = getCharById(charId);
  if (!char || !char.companions) return;
  const amt = parseInt(amount) || 0;
  if (amt <= 0) return;
  const state = char.companions[companionId] || {};
  const maxHp = state.maxHp || 20;
  state.currentHp = Math.min(maxHp, (state.currentHp || 0) + amt);
  char.companions[companionId] = state;
  saveState();
  renderCharacterSheet();
  showToast(`${COMPANION_DEFS[companionId]?.name || 'Companion'} healed for ${amt} (${state.currentHp} HP)`, 'success');
}

function companionFullHeal(charId, companionId, maxHp) {
  const char = getCharById(charId);
  if (!char || !char.companions) return;
  const state = char.companions[companionId] || {};
  state.currentHp = maxHp;
  char.companions[companionId] = state;
  saveState();
  renderCharacterSheet();
  showToast(`${COMPANION_DEFS[companionId]?.name || 'Companion'} fully healed!`, 'success');
}

function reviveCompanion(charId, companionId, maxHp) {
  const char = getCharById(charId);
  if (!char || !char.companions) return;
  const state = char.companions[companionId] || {};
  state.currentHp = maxHp;
  char.companions[companionId] = state;
  saveState();
  renderCharacterSheet();
  showToast(`${COMPANION_DEFS[companionId]?.name || 'Companion'} has returned!`, 'success');
}

function setCannonType(charId, cannonType) {
  const char = getCharById(charId);
  if (!char || !char.companions) return;
  const state = char.companions['eldritch_cannon'] || {};
  state.cannonType = cannonType;
  char.companions['eldritch_cannon'] = state;
  saveState();
  renderCharacterSheet();
  document.getElementById('cs-tab-companions')?.scrollIntoView({behavior:'smooth',block:'nearest'});
}


function csTabSwitch(btn, paneId) {
  document.querySelectorAll('.cs-tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.cs-tab-pane').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(paneId).classList.add('active');
}

function csDamage(charId) {

function toggleDeathSave(charId, type, idx) {

    saveState(); navigateTo('characters');

function switchTab(button, tabId) {
  if (!tabId) {
    // Get tab ID from button's onclick attribute or find the corresponding pane
    const panes = document.querySelectorAll('.tab-pane');
    panes.forEach(pane => pane.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
    
    // Find which tab to activate based on button position
    const buttons = Array.from(document.querySelectorAll('.tab-button'));
    const index = buttons.indexOf(button);
    if (index >= 0 && panes[index]) {
      panes[index].classList.add('active');
    }
  } else {
    document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    button.classList.add('active');
  }
}

function addSpellToCharacter(spellId) {
  if (!AppState.selectedCharacter) {
    showToast('Please select a character', 'error');
    closeModal();
    return;
  }

  if (!AppState.selectedCharacter.spells) {
    AppState.selectedCharacter.spells = [];
  }

  if (!AppState.selectedCharacter.spells.includes(spellId)) {
    AppState.selectedCharacter.spells.push(spellId);
    saveState();
    showToast('Spell added to character', 'success');
    closeModal();
    if (AppState.currentView === 'character-sheet') {
      renderCharacterSheet();
    }
  } else {
    showToast('Spell already added', 'warning');
  }
}

function removeSpellFromCharacter(spellId) {
  if (!AppState.selectedCharacter) return;
  if (!AppState.selectedCharacter.spells) return;
  AppState.selectedCharacter.spells = AppState.selectedCharacter.spells.filter(id => id !== spellId);
  const idx = AppState.characters.findIndex(c => c.id === AppState.selectedCharacter.id);
  if (idx !== -1) AppState.characters[idx] = AppState.selectedCharacter;
  saveState();
  showToast('Spell removed', 'info');
  navigateTo('character-sheet');
}

let tooltipTimeout = null;

function showSpellTooltip(event, spellId) {
  hideSpellTooltip();
  tooltipTimeout = setTimeout(() => {
    const spell = DND_DATA.spells.find(s => s.id === spellId);
    if (!spell) return;
    const existing = document.getElementById('spell-hover-tooltip');
    if (existing) existing.remove();
    const levelStr = spell.level === 0 ? 'Cantrip' : `${spell.level}e level`;
    const tooltip = document.createElement('div');
    tooltip.id = 'spell-hover-tooltip';
    tooltip.className = 'spell-hover-tooltip';
    tooltip.innerHTML = `
      <div class="tooltip-header">
        <strong style="color:var(--accent-gold);font-size:1.05rem;">${spell.name}</strong>
        <span style="color:var(--text-muted);font-size:0.85rem;">${levelStr} ${spell.school}</span>
      </div>
      <div class="tooltip-meta">
        <span><i class="fas fa-clock"></i> ${spell.castingTime}</span>
        <span><i class="fas fa-ruler-horizontal"></i> ${spell.range}</span>
        <span><i class="fas fa-stopwatch"></i> ${spell.duration}</span>
        <span><i class="fas fa-scroll"></i> ${Array.isArray(spell.components) ? spell.components.join(', ') : spell.components}</span>
      </div>
      ${spell.concentration ? '<span class="tooltip-badge conc">◉ Concentration</span>' : ''}${spell.ritual ? '<span class="tooltip-badge ritual">✦ Ritual</span>' : ''}
      <p class="tooltip-desc">${spell.descriptionFull || spell.description}</p>
      <div style="color:var(--text-muted);font-size:0.75rem;margin-top:6px;font-style:italic;">Click for full details</div>
    `;
    document.body.appendChild(tooltip);
    // Position tooltip
    const rect = event.target.closest('.spell-card, .spell-row, [data-spell]') ?
      event.target.closest('.spell-card, .spell-row, [data-spell]').getBoundingClientRect() :
      { right: event.clientX, top: event.clientY, left: event.clientX };
    const tipW = 320;
    const tipH = tooltip.offsetHeight || 200;
    let left = rect.right + 10;
    let top = rect.top;
    if (left + tipW > window.innerWidth) left = rect.left - tipW - 10;
    if (top + tipH > window.innerHeight) top = window.innerHeight - tipH - 10;
    if (top < 0) top = 10;
    tooltip.style.left = Math.max(5, left) + 'px';
    tooltip.style.top = Math.max(5, top) + 'px';
  }, 400);
}

function hideSpellTooltip() {
  if (tooltipTimeout) { clearTimeout(tooltipTimeout); tooltipTimeout = null; }
  const tooltip = document.getElementById('spell-hover-tooltip');
  if (tooltip) tooltip.remove();
}

    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
    
    if (panes[index]) panes[index].classList.add('active');

    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2);
}

function saveState() {
  try {
    localStorage.setItem('dnd_app_state', JSON.stringify(AppState));
  } catch (e) {
    if (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || (e.code && e.code === 22)) {
      try {
        var slim = JSON.parse(JSON.stringify(AppState));
        slim.characters.forEach(function(c) { c.portrait = null; });
        if (slim.characterBuilder) slim.characterBuilder.portrait = null;
        localStorage.setItem('dnd_app_state', JSON.stringify(slim));
        showToast('Saved (portrait not stored — storage full)', 'warning');
      } catch (e2) {
        showToast('Save mislukt: lokale opslag vol', 'error');
        console.error('saveState fallback mislukt:', e2);
      }
    } else {
      console.error('saveState fout:', e);
    }
  }
}

function loadState() {
  const saved = localStorage.getItem('dnd_app_state');
  if (saved) {
    try {
      const loaded = JSON.parse(saved);
      Object.assign(AppState, loaded);
      // Zorg dat characterBuilder alle vereiste velden heeft (ook bij oude saves)
      var cb = AppState.characterBuilder;
      if (!cb) { AppState.characterBuilder = {}; cb = AppState.characterBuilder; }
      if (!Array.isArray(cb.infusions)) cb.infusions = [];
      if (!Array.isArray(cb.weaponsSelected)) cb.weaponsSelected = [];
      if (cb.shieldEquipped === undefined) cb.shieldEquipped = false;
      if (cb.armorEquipped === undefined) cb.armorEquipped = null;
      if (cb.startingGold === undefined) cb.startingGold = 0;
    } catch (e) {
      console.error('Error loading state:', e);
    }
  }
}

function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  
  const icons = {
    success: 'fas fa-check-circle',
    error: 'fas fa-exclamation-circle',
    warning: 'fas fa-exclamation-triangle',
    info: 'fas fa-info-circle'
  };

  toast.innerHTML = `
    <i class="${icons[type]} toast-icon"></i>
    <div class="toast-message">${message}</div>
  `;

  container.appendChild(toast);

  setTimeout(() => {
    toast.style.animation = 'fadeOut 0.3s ease-out';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

function toggleTheme() {
  const newTheme = AppState.theme === 'dark' ? 'light' : 'dark';

  localStorage.setItem('dnd_theme', newTheme);

function toggleDicePanel() {
  const panel = document.getElementById('dice-roller-panel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  if (panel.style.display === 'block') {
    document.getElementById('dice-notation').focus();
  }
}

function rollDiceHandler() {
  const notation = document.getElementById('dice-notation').value;
  const hasAdvantage = document.getElementById('advantage-check').checked;
  const hasDisadvantage = document.getElementById('disadvantage-check').checked;

  let result;
  
  if (hasAdvantage) {
    const roll1 = Math.floor(Math.random() * 20) + 1;
    const roll2 = Math.floor(Math.random() * 20) + 1;
    result = Math.max(roll1, roll2);
    addToRollHistory(`2d20 (Voordeel: ${roll1}, ${roll2})`, result);
  } else if (hasDisadvantage) {
    const roll1 = Math.floor(Math.random() * 20) + 1;
    const roll2 = Math.floor(Math.random() * 20) + 1;
    result = Math.min(roll1, roll2);
    addToRollHistory(`2d20 (Nadeel: ${roll1}, ${roll2})`, result);
  } else {
    result = rollDice(notation);
    addToRollHistory(notation, result);
  }

  const resultEl = document.getElementById('dice-result');
  resultEl.innerHTML = `
    <div style="text-align: center;">
      <div style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: var(--spacing-sm);">${notation}</div>
      <div style="font-size: 2rem; color: var(--accent-green); font-weight: 700;">${result}</div>
    </div>
  `;

  updateRollHistory();
}

function rollDice(notation) {
  // Simple dice roller: supports "2d6+3" format
  const match = notation.match(/^(\d+)d(\d+)(?:[+\-](\d+))?$/);
  if (!match) return 0;

  const [, count, sides, modifier] = match;
  let total = 0;
  const diceCount = parseInt(count);
  const diceSides = parseInt(sides);
  
  for (let i = 0; i < diceCount; i++) {
    total += Math.floor(Math.random() * diceSides) + 1;
  }

  if (modifier) {
    total += parseInt(modifier);
  }

  return total;
}

function addToRollHistory(notation, result) {
  AppState.diceHistory.unshift({
    notation,
    result,
    timestamp: new Date().toLocaleTimeString()
  });

  if (AppState.diceHistory.length > 10) {
    AppState.diceHistory.pop();
  }
}

function updateRollHistory() {
  const historyList = document.getElementById('dice-history-list');
  if (historyList) {
    historyList.innerHTML = AppState.diceHistory.map(roll => `
      <div class="dice-history-item">
        <span>${roll.notation}</span>
        <span class="dice-history-result">${roll.result}</span>
      </div>
    `).join('');
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// TOOLTIP & DETAIL POPUP SYSTEM
// ═══════════════════════════════════════════════════════════════════════════

(function() {
  var tooltip = null;

  function getTooltip() {
    if (!tooltip) {
      tooltip = document.createElement('div');
      tooltip.className = 'dnd-tooltip';
      document.body.appendChild(tooltip);
    }
    return tooltip;
  }

  function positionTooltip(e) {
    var tt = getTooltip();
    var x = e.clientX + 14, y = e.clientY + 14;
    var w = tt.offsetWidth || 300, h = tt.offsetHeight || 200;
    if (x + w > window.innerWidth - 10)  x = e.clientX - w - 14;
    if (y + h > window.innerHeight - 10) y = e.clientY - h - 14;
    tt.style.left = x + 'px';
    tt.style.top  = y + 'px';
  }

  function showTooltipContent(html, e) {
    var tt = getTooltip();
    tt.innerHTML = html;
    tt.classList.add('visible');
    positionTooltip(e);
  }

  function hideTooltip() {
    var tt = getTooltip();
    tt.classList.remove('visible');
  }

  // ── Spell tooltip ──────────────────────────────────────────────────────
  window.spellTooltipEnter = function(spellId, e) {
    var sp = (DND_DATA.spells || []).find(function(s){ return s.id === spellId; });
    if (!sp) return;
    var lvl = sp.level === 0 ? 'Cantrip' : sp.level + (sp.level===1?'st':sp.level===2?'nd':sp.level===3?'rd':'th') + ' Level';
    var comps = [];
    if (sp.components) {
      if (sp.components.V||sp.verbal) comps.push('V');
      if (sp.components.S||sp.somatic) comps.push('S');
      if (sp.components.M||sp.material) comps.push('M');
    } else {
      comps = ['V','S'];
    }
    var html = '<div class="dnd-tooltip-header">'
      + '<div class="dnd-tooltip-name">' + sp.name
      + '<span class="dnd-tooltip-school-badge">' + (sp.school||'') + '</span></div>'
      + '<div class="dnd-tooltip-meta">' + lvl
      + (sp.concentration ? ' &nbsp;<span class="dnd-tooltip-conc">◉ Concentration</span>' : '')
      + (sp.ritual ? ' &nbsp;<span class="dnd-tooltip-ritual">⟳ Ritual</span>' : '')
      + '</div></div>'
      + '<div class="dnd-tooltip-body">'
      + '<div class="dnd-tooltip-row"><label>Casting Time</label><span>' + (sp.castingTime||sp.casting_time||'—') + '</span></div>'
      + '<div class="dnd-tooltip-row"><label>Range</label><span>' + (sp.range||'—') + '</span></div>'
      + '<div class="dnd-tooltip-row"><label>Components</label><span>' + comps.join(', ') + '</span></div>'
      + '<div class="dnd-tooltip-row"><label>Duration</label><span>' + (sp.duration||'—') + '</span></div>'
      + '<div class="dnd-tooltip-desc">' + ((sp.description||sp.desc||'').substring(0,200) + ((sp.description||sp.desc||'').length>200?'…':'')) + '</div>'
      + '</div>';
    showTooltipContent(html, e);
  };
  window.spellTooltipLeave = hideTooltip;
  window.spellTooltipMove  = function(e) { positionTooltip(e); };

  // ── Infusion tooltip ──────────────────────────────────────────────────
  window.infusionTooltipEnter = function(name, e) {
    var inf = (typeof ARTIFICER_INFUSIONS !== 'undefined' ? ARTIFICER_INFUSIONS : [])
      .find(function(i){ return i.name === name; });
    if (!inf) return;
    var html = '<div class="dnd-tooltip-header">'
      + '<div class="dnd-tooltip-name">' + inf.name + '</div>'
      + '<div class="dnd-tooltip-meta">' + (inf.itemType || 'Magic Item')
      + (inf.minLevel ? ' &nbsp;•&nbsp; Requires Level ' + inf.minLevel : '') + '</div></div>'
      + '<div class="dnd-tooltip-body">'
      + '<div class="dnd-tooltip-desc">' + ((inf.description||'').substring(0,250) + ((inf.description||'').length>250?'…':'')) + '</div>'
      + '</div>';
    showTooltipContent(html, e);
  };
  window.infusionTooltipLeave = hideTooltip;
  window.infusionTooltipMove  = function(e) { positionTooltip(e); };

  // ── Monster tooltip ────────────────────────────────────────────────────
  window.monsterTooltipEnter = function(monsterId, e) {
    var m = (DND_DATA.monsters || []).find(function(x){ return x.id === monsterId || x.name === monsterId; });
    if (!m) return;
    var html = '<div class="dnd-tooltip-header">'
      + '<div class="dnd-tooltip-name">' + m.name + '</div>'
      + '<div class="dnd-tooltip-meta">' + (m.size||'') + ' ' + (m.type||'') + (m.alignment ? ', ' + m.alignment : '') + '</div></div>'
      + '<div class="dnd-tooltip-body">'
      + '<div class="dnd-tooltip-row"><label>CR</label><span>' + (m.cr !== undefined ? m.cr : '—') + '</span></div>'
      + '<div class="dnd-tooltip-row"><label>AC</label><span>' + (m.ac||'—') + '</span></div>'
      + '<div class="dnd-tooltip-row"><label>HP</label><span>' + (m.hp||'—') + '</span></div>'
      + '<div class="dnd-tooltip-row"><label>Speed</label><span>' + (m.speed||'—') + '</span></div>'
      + (m.abilities ? '<div class="dnd-tooltip-row"><label>Abilities</label><span>STR '+(m.abilities[0]||'?')+' DEX '+(m.abilities[1]||'?')+' CON '+(m.abilities[2]||'?')+'</span></div>' : '')
      + (m.description ? '<div class="dnd-tooltip-desc">' + m.description.substring(0,200) + '</div>' : '')
      + '</div>';
    showTooltipContent(html, e);
  };
  window.monsterTooltipLeave = hideTooltip;
  window.monsterTooltipMove  = function(e) { positionTooltip(e); };

  // ── Click to open full detail modal ────────────────────────────────────
  // showSpellDetail is handled by the existing comprehensive implementation above
  // showMonsterDetail is handled by the existing comprehensive implementation above

  window.showInfusionDetail = function(name) {
    var inf = (typeof ARTIFICER_INFUSIONS !== 'undefined' ? ARTIFICER_INFUSIONS : [])
      .find(function(i){ return i.name === name; });
    if (!inf) return;
    var html = '<div class="dnd-detail-modal-header">'
      + '<div><div class="dnd-detail-modal-title">' + inf.name + '</div>'
      + '<div class="dnd-detail-modal-subtitle">Artificer Infusion'
      + (inf.minLevel ? ' • Requires Level ' + inf.minLevel : '') + '</div></div>'
      + '<button class="dnd-detail-modal-close" onclick="closeDndModal()">✕</button></div>'
      + '<div class="dnd-detail-modal-body">'
      + (inf.itemType ? '<div class="dnd-detail-row"><label>Item Type</label><span>' + inf.itemType + '</span></div><hr class="dnd-detail-divider">' : '')
      + '<div class="dnd-detail-desc">' + (inf.description||'') + '</div>'
      + '</div>';
    openDndModal(html);
    hideTooltip();
  };


  window.openDndModal = function(html) {
    closeDndModal();
    var overlay = document.createElement('div');
    overlay.className = 'dnd-detail-modal-overlay';
    overlay.id = 'dnd-modal-overlay';
    overlay.onclick = function(e) { if (e.target === overlay) closeDndModal(); };
    var modal = document.createElement('div');
    modal.className = 'dnd-detail-modal';
    modal.innerHTML = html;
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
  };

  window.closeDndModal = function() {
    var el = document.getElementById('dnd-modal-overlay');
    if (el) el.remove();
  };

  // Close modal on Escape
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeDndModal();
  });
})();

</script>
